<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Creator Dashboard — MONI DRESSES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: "#b3006a", surface: "#fbf9f8" }, fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] } } }
    }
  </script>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen pb-24">

  <!-- Header -->
  <header class="fixed top-0 left-0 w-full z-40 bg-white border-b border-zinc-100 px-4 py-3 flex justify-between items-center shadow-sm">
    <h1 class="text-sm font-extrabold text-primary uppercase tracking-wider">Creator Portal</h1>
    <span id="creator-code-badge" class="bg-primary/10 text-primary text-xs font-bold px-3 py-1 rounded-full">Code: --</span>
  </header>

  <main class="max-w-[600px] mx-auto pt-20 px-4 space-y-4">
    
    <!-- Earnings & Stats Overview -->
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-white p-3 rounded-2xl border border-zinc-200 shadow-sm">
        <p class="text-[10px] font-bold text-zinc-400 uppercase">Total Sales</p>
        <p id="stat-sales" class="text-base font-black text-zinc-900 mt-1">0</p>
      </div>
      <div class="bg-white p-3 rounded-2xl border border-zinc-200 shadow-sm">
        <p class="text-[10px] font-bold text-zinc-400 uppercase">Return/Cancel</p>
        <p id="stat-returns" class="text-base font-black text-rose-600 mt-1">0</p>
      </div>
      <div class="bg-white p-3 rounded-2xl border border-zinc-200 shadow-sm">
        <p class="text-[10px] font-bold text-zinc-400 uppercase">Wallet Balance</p>
        <p id="stat-wallet" class="text-base font-black text-emerald-600 mt-1">₹0</p>
      </div>
    </div>

    <!-- Withdrawal Section with Limit -->
    <div class="bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm space-y-3">
      <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Bank Withdrawal</h2>
      <p class="text-[11px] text-zinc-500">Minimum withdrawal limit is <strong class="text-zinc-800">₹1,000</strong> (or minimum 5 successful orders).</p>
      <button onclick="requestWithdrawal()" class="w-full py-3 bg-primary text-white font-extrabold text-xs rounded-xl shadow-md active:scale-95 transition-all uppercase">
        Request Bank Payout
      </button>
    </div>

    <!-- Assigned Products for Videos -->
    <div class="bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm space-y-3">
      <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider border-b border-zinc-100 pb-2">Products Assigned For Your Videos</h2>
      <div id="assigned-products-container" class="space-y-3">
        <p class="text-xs text-zinc-400 text-center py-4">No products assigned yet by admin.</p>
      </div>
    </div>

  </main>

  <script>
    function requestWithdrawal() {
      const currentBalance = 750;
      const minLimit = 1000;

      if (currentBalance < minLimit) {
        alert(`Your balance is ₹${currentBalance}. Minimum ₹${minLimit} is required to request a payout.`);
        return;
      }
      alert("Withdrawal request submitted successfully to admin!");
    }
  </script>
</body>
</html>
