<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Creator Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: "#b3006a", surface: "#fbf9f8" } } }
    }
  </script>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen pb-10">

  <!-- Header -->
  <header class="fixed top-0 w-full bg-white border-b border-zinc-100 px-4 py-3 flex items-center justify-between shadow-sm z-50">
    <button onclick="history.back()" class="p-1"><span class="material-symbols-outlined">arrow_back</span></button>
    <h1 class="text-sm font-black text-primary uppercase">Creator Dashboard</h1>
    <div id="promo-badge" class="bg-primary/10 text-primary text-[10px] font-bold px-3 py-1 rounded-full">Code: --</div>
  </header>

  <main class="max-w-md mx-auto pt-20 px-4 space-y-4">
    
    <!-- Stats Section -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-white p-3 rounded-2xl border text-center shadow-sm">
        <p class="text-[9px] font-bold text-zinc-400 uppercase">Sales</p>
        <p id="stat-sales" class="text-sm font-black text-zinc-900">0</p>
      </div>
      <div class="bg-white p-3 rounded-2xl border text-center shadow-sm">
        <p class="text-[9px] font-bold text-zinc-400 uppercase">Returns</p>
        <p id="stat-returns" class="text-sm font-black text-rose-600">0</p>
      </div>
      <div class="bg-white p-3 rounded-2xl border text-center shadow-sm">
        <p class="text-[9px] font-bold text-zinc-400 uppercase">Wallet</p>
        <p id="stat-wallet" class="text-sm font-black text-emerald-600">₹0</p>
      </div>
    </div>

    <!-- Payout Section -->
    <div class="bg-white p-4 rounded-2xl border shadow-sm">
      <h2 class="text-xs font-bold text-zinc-500 uppercase">Bank Withdrawal</h2>
      <p class="text-[10px] text-zinc-400 mt-1">Min limit: ₹1,000 or 5 successful orders.</p>
      <button onclick="requestPayout()" class="w-full mt-3 py-3 bg-primary text-white text-xs font-bold rounded-xl active:scale-95">REQUEST PAYOUT</button>
    </div>

    <!-- Assigned Products -->
    <div class="bg-white p-4 rounded-2xl border shadow-sm">
      <h2 class="text-xs font-bold text-zinc-500 uppercase mb-3">Assigned Products</h2>
      <div id="product-list" class="space-y-2">
        <!-- Products will be injected via JS -->
      </div>
    </div>
  </main>

  <script type="module">
    // Firebase Logic to fetch creator data goes here
    // Logic: 
    // 1. Fetch user data from 'creators' collection in Firestore using current auth.uid
    // 2. Fetch all orders from 'orders' where creatorId == uid
    // 3. Calculate sales (Delivered) - returns (Cancelled/Returned)
    // 4. Update the DOM elements (stat-sales, stat-returns, stat-wallet)
  </script>
</body>
</html>
