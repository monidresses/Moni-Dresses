<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Checkout — MONI DRESSES</title><script src="https://cdn.tailwindcss.com"></script><script src="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></script><script>tailwind.config={theme:{extend:{colors:{primary:'#b3006a',surface:'#fbf9f8'},fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script></head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen pb-24"><header class="fixed top-0 left-0 w-full z-40 flex items-center px-4 py-3 bg-white border-b border-zinc-100 shadow-sm"><button onclick="history.back()" class="p-1">←</button><h1 class="text-base font-extrabold text-primary ml-3 uppercase tracking-wider">Checkout & Shipping</h1></header>
<main class="max-w-[550px] mx-auto pt-16 px-4 space-y-5"><form id="checkout-form" class="space-y-4">
<section class="bg-white p-4 rounded-2xl border space-y-4"><h3 class="text-xs font-bold text-zinc-400 uppercase">Delivery Address</h3><div id="saved-address-section" class="hidden"><label class="flex gap-3 p-3 border rounded-xl"><input type="radio" name="addressSelect" value="saved" id="radio-saved" onchange="toggleAddressOption()"><div><p id="saved-name" class="font-bold"></p><p id="saved-phone"></p><p id="saved-full-addr" class="text-zinc-500 text-xs"></p></div></label></div><label class="flex gap-3 p-3 border rounded-xl"><input type="radio" name="addressSelect" value="new" id="radio-new" onchange="toggleAddressOption()">+ Add New Address</label>
<div id="address-inputs" class="space-y-3 hidden"><div class="grid grid-cols-2 gap-2"><input id="cust-name" placeholder="Full Name *" class="p-2 border rounded-xl"><input id="cust-phone" inputmode="numeric" maxlength="10" placeholder="Mobile Number *" class="p-2 border rounded-xl"></div><input id="cust-building" placeholder="House / Building *" class="w-full p-2 border rounded-xl"><input id="cust-area" placeholder="Street / Area *" class="w-full p-2 border rounded-xl"><input id="cust-village" placeholder="Village / Landmark" class="w-full p-2 border rounded-xl"><div class="grid grid-cols-2 gap-2"><input id="cust-city" placeholder="City / Town *" class="p-2 border rounded-xl"><input id="cust-district" placeholder="District *" class="p-2 border rounded-xl"><input id="cust-state" placeholder="State *" class="p-2 border rounded-xl"><input id="cust-pin" inputmode="numeric" maxlength="6" placeholder="PIN Code *" class="p-2 border rounded-xl"></div></div></section>
<section class="bg-white p-4 rounded-2xl border space-y-3"><h3 class="text-xs font-bold text-zinc-400 uppercase">Payment Options</h3><label class="flex justify-between p-3 border rounded-xl"><span><input type="radio" name="paymentMethod" value="razorpay" checked onchange="updateOrderSummary()"> Online Payment (UPI, Cards)</span></label><label class="flex justify-between p-3 border rounded-xl"><span><input type="radio" name="paymentMethod" value="cod" onchange="updateOrderSummary()"> Cash on Delivery</span></label></section>
<section class="bg-white p-4 rounded-2xl border space-y-3"><h3 class="text-xs font-bold text-zinc-400 uppercase">Order Summary</h3><div class="flex justify-between"><span>Subtotal</span><span id="summary-subtotal">₹0</span></div><div class="flex justify-between"><span>Delivery</span><span id="summary-delivery">FREE</span></div><div class="flex justify-between font-black border-t pt-3"><span>Total</span><span id="summary-total" class="text-primary">₹0</span></div></section><button type="submit" id="submit-btn" class="w-full py-4 bg-primary text-white font-extrabold rounded-xl">Place Order</button></form></main>
<div id="recaptcha-container"></div><div id="otp-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4"><h3 class="font-bold">Verify Mobile Number</h3><p class="text-xs">Enter the OTP sent to <span id="otp-phone-display"></span></p><input id="otp-input" maxlength="6" class="w-full p-3 border rounded-xl" placeholder="123456"><button onclick="verifyCODOTP()" class="w-full py-3 bg-primary text-white rounded-xl">Verify & Confirm</button><button onclick="closeModal('otp-modal')" class="w-full">Cancel</button></div></div>
<script type="module">import { auth } from './common.js'; import { RecaptchaVerifier, signInWithPhoneNumber } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js'; import { persistOrder } from './checkout.js';
let finalOrderAmount=0, confirmationResult=null, recaptchaVerifier=null;
const cart=()=>JSON.parse(localStorage.getItem('cartItems')||'[]'); const subtotal=()=>cart().reduce((s,i)=>s+Number(i.price||0)*(Number(i.qty||i.quantity||1)),0);
function charges(){const s=JSON.parse(localStorage.getItem('adminSettings')||'{}');return {prepaid:Number(s.prepaidDelivery||0),cod:Number(s.codDelivery??60)};}
window.updateOrderSummary=()=>{const method=document.querySelector('[name="paymentMethod"]:checked')?.value||'razorpay';const fee=method==='razorpay'?charges().prepaid:charges().cod;finalOrderAmount=subtotal()+fee;document.getElementById('summary-subtotal').textContent=`₹${subtotal()}`;document.getElementById('summary-delivery').textContent=fee?'₹'+fee:'FREE';document.getElementById('summary-total').textContent=`₹${finalOrderAmount}`;document.getElementById('submit-btn').textContent=`Place Order • ₹${finalOrderAmount}`;};
window.toggleAddressOption=()=>{const saved=document.querySelector('[name="addressSelect"]:checked')?.value==='saved';document.getElementById('address-inputs').classList.toggle('hidden',saved);document.querySelectorAll('#address-inputs input').forEach(i=>i.required=!saved&&i.id!=='cust-village');};
function loadAddress(){const u=JSON.parse(localStorage.getItem('userProfile')||'{}');if(u.address?.city){document.getElementById('saved-address-section').classList.remove('hidden');document.getElementById('radio-saved').checked=true;document.getElementById('saved-name').textContent=u.name||'Customer';document.getElementById('saved-phone').textContent=u.phone||'';const a=u.address;document.getElementById('saved-full-addr').textContent=[a.building,a.area,a.village,a.city,a.district,a.state,a.pin].filter(Boolean).join(', ');}else document.getElementById('radio-new').checked=true;toggleAddressOption();}
function address(){if(document.querySelector('[name="addressSelect"]:checked')?.value==='saved'){const u=JSON.parse(localStorage.getItem('userProfile')||'{}'),a=u.address||{};return {name:u.name||'',phone:u.phone||'',address:[a.building,a.area,a.village].filter(Boolean).join(', '),city:a.city||'',pinCode:a.pin||''};}return {name:document.getElementById('cust-name').value.trim(),phone:document.getElementById('cust-phone').value.trim(),address:[document.getElementById('cust-building').value,document.getElementById('cust-area').value,document.getElementById('cust-village').value].filter(Boolean).join(', '),city:document.getElementById('cust-city').value.trim(),pinCode:document.getElementById('cust-pin').value.trim()};}
async function createCodOrder(){const a=address();const id='MD-COD-'+Date.now();await persistOrder(id,finalOrderAmount,'cod',{status:'pending'});localStorage.setItem('latestOrderId',id);localStorage.removeItem('cartItems');location.href='order-success.html';}
async function verifyCODOTP(){try{await confirmationResult.confirm(document.getElementById('otp-input').value.trim());document.getElementById('otp-modal').classList.add('hidden');await createCodOrder();}catch(e){alert('Invalid OTP. Please try again.');}}
window.verifyCODOTP=verifyCODOTP;window.closeModal=id=>document.getElementById(id).classList.add('hidden');
document.getElementById('checkout-form').addEventListener('submit',async e=>{e.preventDefault();if(!auth.currentUser){location.href='login.html?redirect=checkout.html';return;}if(!cart().length){alert('Your cart is empty.');return;}const a=address();if(!a.name||!/^[0-9]{10}$/.test(a.phone)||!a.city||!/^[0-9]{6}$/.test(a.pinCode)){alert('Please enter a valid delivery address.');return;}const method=document.querySelector('[name="paymentMethod"]:checked').value;if(method==='cod'){try{if(!recaptchaVerifier)recaptchaVerifier=new RecaptchaVerifier(auth,'recaptcha-container',{size:'invisible'});confirmationResult=await signInWithPhoneNumber(auth,'+91'+a.phone,recaptchaVerifier);document.getElementById('otp-phone-display').textContent='+91 '+a.phone;document.getElementById('otp-modal').classList.remove('hidden');}catch(err){alert(err.message||'Unable to send OTP.');}}else alert('Online payment is being connected securely through the Firebase Razorpay Cloud Function.');});
window.addEventListener('DOMContentLoaded',()=>{loadAddress();updateOrderSummary();});</script></body></html>
