<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Checkout — MONI DRESSES</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script> <!-- Razorpay SDK -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#b3006a", surface: "#fbf9f8" },
          fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen pb-24">

  <!-- ========================================== -->
  <!-- 🛍️ 1. TOP HEADER -->
  <!-- ========================================== -->
  <header class="fixed top-0 left-0 w-full z-40 flex items-center px-4 py-3 bg-white border-b border-zinc-100 shadow-sm">
    <button onclick="history.back()" class="p-1 text-zinc-700 hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-2xl">arrow_back</span>
    </button>
    <h1 class="text-base font-extrabold text-primary ml-3 uppercase tracking-wider">Checkout & Shipping</h1>
  </header>

  <main class="max-w-[550px] mx-auto pt-16 px-4 space-y-5">

    <!-- ========================================== -->
    <!-- 🏡 2. SAVED ADDRESS SELECTION (PROFILE) -->
    <!-- ========================================== -->
    <div id="saved-address-section" class="bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm space-y-3 hidden">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Saved Profile Address</h3>
        <span class="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded-full">Default</span>
      </div>
      
      <label class="flex items-start gap-3 p-3 border border-primary/30 bg-primary/5 rounded-xl cursor-pointer">
        <input type="radio" name="addressSelect" value="saved" checked onchange="toggleAddressOption()" class="mt-1 accent-primary">
        <div class="text-xs space-y-1">
          <p id="saved-name" class="font-bold text-zinc-900"></p>
          <p id="saved-phone" class="text-zinc-600 font-medium"></p>
          <p id="saved-full-addr" class="text-zinc-500 leading-relaxed"></p>
        </div>
      </label>
    </div>

    <!-- ========================================== -->
    <!-- 📝 3. SHIPPING ADDRESS FORM -->
    <!-- ========================================== -->
    <form id="checkout-form" class="space-y-4">
      
      <div class="bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm space-y-3">
        <div class="flex items-center justify-between border-b border-zinc-100 pb-2">
          <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Delivery Address</h3>
          <label class="flex items-center gap-1.5 text-xs text-primary font-bold cursor-pointer">
            <input type="radio" name="addressSelect" value="new" id="use-new-addr-radio" onchange="toggleAddressOption()" class="accent-primary">
            <span>+ Add New Address</span>
          </label>
        </div>

        <!-- Form Inputs Grid -->
        <div id="address-inputs" class="space-y-3 pt-1">
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">Full Name *</label>
              <input type="text" id="cust-name" required placeholder="Avijit Chakraborty" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">Mobile Number *</label>
              <input type="tel" id="cust-phone" required pattern="[0-9]{10}" placeholder="10 Digit Number" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
          </div>

          <div>
            <label class="text-[10px] font-bold text-zinc-500 uppercase">Flat / House No. / Building Name *</label>
            <input type="text" id="cust-building" required placeholder="House No. 12B, Chakraborty Villa" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">Street / Area / Colony *</label>
              <input type="text" id="cust-area" required placeholder="Station Road Area" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">Village / Landmark</label>
              <input type="text" id="cust-village" placeholder="Near Market" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">City / Town *</label>
              <input type="text" id="cust-city" required placeholder="Kolkata" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">District *</label>
              <input type="text" id="cust-district" required placeholder="North 24 Parganas" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">State *</label>
              <input type="text" id="cust-state" required placeholder="West Bengal" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">PIN Code *</label>
              <input type="text" id="cust-pin" required pattern="[0-9]{6}" placeholder="700001" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
          </div>
        </div>

      </div>

      <!-- ========================================== -->
      <!-- 💳 4. PAYMENT METHOD -->
      <!-- ========================================== -->
      <div class="bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm space-y-3">
        <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Payment Options</h3>
        
        <label class="flex items-center justify-between p-3 border border-zinc-200 rounded-xl cursor-pointer hover:border-primary transition-colors">
          <div class="flex items-center gap-3">
            <input type="radio" name="paymentMethod" value="razorpay" checked class="accent-primary">
            <div>
              <p class="text-xs font-bold text-zinc-800">Online Payment (UPI, Cards, NetBanking)</p>
              <p class="text-[10px] text-emerald-600 font-semibold">Fast & Secure via Razorpay</p>
            </div>
          </div>
          <span class="material-symbols-outlined text-primary text-xl">payments</span>
        </label>

        <label class="flex items-center justify-between p-3 border border-zinc-200 rounded-xl cursor-pointer hover:border-primary transition-colors">
          <div class="flex items-center gap-3">
            <input type="radio" name="paymentMethod" value="cod" class="accent-primary">
            <div>
              <p class="text-xs font-bold text-zinc-800">Cash on Delivery (COD)</p>
              <p class="text-[10px] text-zinc-400">Mobile OTP Verification Required</p>
            </div>
          </div>
          <span class="material-symbols-outlined text-zinc-500 text-xl">local_shipping</span>
        </label>
      </div>

      <button type="submit" id="submit-btn" class="w-full py-4 bg-primary text-white font-extrabold text-xs rounded-xl shadow-md active:scale-95 transition-all uppercase tracking-wider">
        Confirm & Place Order
      </button>
    </form>

  </main>

  <!-- ========================================== -->
  <!-- 🔐 5. OTP MODAL POPUP FOR COD ORDERS -->
  <!-- ========================================== -->
  <div id="otp-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl space-y-4 text-center">
      <div class="w-12 h-12 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto">
        <span class="material-symbols-outlined text-2xl">sms</span>
      </div>
      
      <div>
        <h3 class="text-sm font-bold text-zinc-800">Verify Mobile Number</h3>
        <p class="text-xs text-zinc-500 mt-1">Enter OTP sent to <span id="otp-phone-display" class="font-bold text-zinc-800"></span></p>
      </div>

      <input type="text" id="otp-input" maxlength="4" placeholder="1 2 3 4" class="w-full text-center tracking-[0.8em] text-lg font-bold p-3 border border-zinc-300 rounded-xl focus:outline-primary bg-zinc-50">

      <button onclick="verifyCODOTP()" class="w-full py-3 bg-primary text-white font-bold text-xs rounded-xl shadow-md active:scale-95 transition-all uppercase">
        Verify & Confirm
      </button>

      <button onclick="closeModal('otp-modal')" class="text-xs font-bold text-zinc-400 hover:text-zinc-600 block mx-auto">
        Cancel
      </button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 🎉 6. ORDER SUCCESS POPUP WITH TICK & ID -->
  <!-- ========================================== -->
  <div id="success-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-4 animate-in fade-in zoom-in duration-300">
      
      <!-- Big Green Check Icon -->
      <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto shadow-inner">
        <span class="material-symbols-outlined text-5xl font-black">check_circle</span>
      </div>

      <div class="space-y-1">
        <h2 class="text-lg font-extrabold text-zinc-900">Order Confirmed!</h2>
        <p class="text-xs text-zinc-500">Thank you for shopping with Moni Dresses.</p>
      </div>

      <!-- Order ID Box -->
      <div class="bg-zinc-50 border border-zinc-200 p-3.5 rounded-2xl space-y-1">
        <p class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider">Your Order ID</p>
        <p id="display-order-id" class="text-base font-extrabold text-primary tracking-wide">MD-892134</p>
      </div>

      <p class="text-[11px] text-zinc-400">We will send shipping updates via WhatsApp / SMS.</p>

      <!-- Action Buttons -->
      <div class="space-y-2 pt-2">
        <button onclick="finishOrderAndGo('account.html')" class="w-full py-3.5 bg-primary text-white font-bold text-xs rounded-xl shadow-md active:scale-95 transition-all uppercase">
          View Order History
        </button>
        <button onclick="finishOrderAndGo('home.html')" class="w-full py-3 text-zinc-600 font-bold text-xs hover:text-zinc-900 transition-colors">
          Back to Home Page
        </button>
      </div>

    </div>
  </div>

  <!-- ========================================== -->
  <!-- ⚙️ 7. JAVASCRIPT LOGIC -->
  <!-- ========================================== -->
  <script>
    let generatedOTP = "1234"; // Test OTP Code

    // Check & Load Saved Address from Profile
    function loadSavedProfileAddress() {
      const savedUser = JSON.parse(localStorage.getItem('userProfile'));
      const savedSection = document.getElementById('saved-address-section');

      if (savedUser && savedUser.address) {
        document.getElementById('saved-name').innerText = savedUser.name || "Customer Name";
        document.getElementById('saved-phone').innerText = "+91 " + (savedUser.phone || "");
        
        const addr = savedUser.address;
        document.getElementById('saved-full-addr').innerText = 
          `${addr.building || ''}, ${addr.area || ''}, ${addr.city || ''}, ${addr.district || ''}, ${addr.state || ''} - ${addr.pin || ''}`;
        
        savedSection.classList.remove('hidden');
        toggleAddressOption();
      }
    }

    // Toggle Form Input Fields based on Radio Selection
    function toggleAddressOption() {
      const addressChoice = document.querySelector('input[name="addressSelect"]:checked')?.value;
      const inputs = document.querySelectorAll('#address-inputs input');

      if (addressChoice === 'saved') {
        inputs.forEach(input => input.removeAttribute('required'));
        document.getElementById('address-inputs').classList.add('opacity-40', 'pointer-events-none');
      } else {
        inputs.forEach(input => {
          if (input.id !== 'cust-village') input.setAttribute('required', 'true');
        });
        document.getElementById('address-inputs').classList.remove('opacity-40', 'pointer-events-none');
        document.getElementById('use-new-addr-radio').checked = true;
      }
    }

    // Get Total Cart Value
    function getCartTotal() {
      const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
      const subtotal = cart.reduce((sum, item) => sum + (Number(item.price) * (Number(item.qty) || 1)), 0);
      return subtotal + 40; // Subtotal + Delivery
    }

    // Trigger Success Confirmation Popup
    function showOrderSuccessModal(orderId) {
      document.getElementById('display-order-id').innerText = orderId;
      document.getElementById('success-modal').classList.remove('hidden');
    }

    // Clear Cart and Redirect
    function finishOrderAndGo(targetUrl) {
      localStorage.removeItem('cartItems'); // Clear Local Cart Storage
      window.location.href = targetUrl;
    }

    // Form Submit Listener
    document.getElementById('checkout-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
      if (cart.length === 0) {
        alert("Your cart is empty!");
        window.location.href = 'home.html';
        return;
      }

      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      const phoneInput = document.getElementById('cust-phone').value || "1234567890";

      if (paymentMethod === 'razorpay') {
        // Razorpay Prepaid Payment Gateway
        const totalAmount = getCartTotal();
        const options = {
          "key": "YOUR_RAZORPAY_KEY", // Replace with your Razorpay Key
          "amount": totalAmount * 100,
          "currency": "INR",
          "name": "MONI DRESSES",
          "description": "Prepaid Order Payment",
          "handler": function (response) {
            const finalId = "MD-RZP-" + Math.floor(100000 + Math.random() * 900000);
            showOrderSuccessModal(finalId);
          },
          "prefill": {
            "name": document.getElementById('cust-name').value,
            "contact": phoneInput
          },
          "theme": { "color": "#b3006a" }
        };
        const rzp = new Razorpay(options);
        rzp.open();

      } else {
        // COD Order OTP Flow
        document.getElementById('otp-phone-display').innerText = "+91 " + phoneInput;
        document.getElementById('otp-modal').classList.remove('hidden');
        alert("Verification OTP sent to your phone! (Test OTP: 1234)");
      }
    });

    // Verify COD OTP
    function verifyCODOTP() {
      const userOTP = document.getElementById('otp-input').value.trim();
      
      if (userOTP === generatedOTP) {
        closeModal('otp-modal');
        const finalId = "MD-COD-" + Math.floor(100000 + Math.random() * 900000);
        showOrderSuccessModal(finalId);
      } else {
        alert("❌ Invalid OTP! Please enter 1234");
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    // Initialize Page
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedProfileAddress();
    });
  </script>
</body>
</html>
