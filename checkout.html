<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Checkout — MONI DRESSES</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#b3006a",
            surface: "#fbf9f8"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
            brand: ["Bodoni Moda", "serif"]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen pb-28">

  <!-- Top Header -->
  <header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-4 py-3 bg-white border-b border-zinc-100 shadow-sm">
    <button onclick="history.back()" aria-label="Back" class="p-1 text-zinc-700 active:scale-95">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="font-bold text-sm text-zinc-800 uppercase tracking-wider">Checkout Address</h1>
    <span class="w-6"></span>
  </header>

  <main class="max-w-[600px] mx-auto pt-16 px-4">

    <!-- Shipping Address Form -->
    <form id="checkout-form" onsubmit="handleOrderSubmit(event)" class="space-y-3 bg-white p-4 rounded-xl border border-zinc-200/80 shadow-sm mb-4">
      <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Delivery Address</h2>

      <div>
        <label class="block text-xs font-bold text-zinc-700 mb-1">Full Name *</label>
        <input type="text" id="cust-name" required placeholder="e.g. Avijit Chakraborty" class="w-full text-xs p-2.5 border border-zinc-200 rounded-lg focus:outline-none focus:border-primary" />
      </div>

      <div>
        <label class="block text-xs font-bold text-zinc-700 mb-1">Mobile Phone Number *</label>
        <input type="tel" id="cust-phone" required placeholder="+91 98765 43210" class="w-full text-xs p-2.5 border border-zinc-200 rounded-lg focus:outline-none focus:border-primary" />
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-zinc-700 mb-1">Pincode *</label>
          <input type="text" id="cust-pincode" maxlength="6" required placeholder="700001" class="w-full text-xs p-2.5 border border-zinc-200 rounded-lg focus:outline-none focus:border-primary" />
        </div>
        <div>
          <label class="block text-xs font-bold text-zinc-700 mb-1">City / Town *</label>
          <input type="text" id="cust-city" required placeholder="Kolkata" class="w-full text-xs p-2.5 border border-zinc-200 rounded-lg focus:outline-none focus:border-primary" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-zinc-700 mb-1">Full Address (House No, Street, Landmark) *</label>
        <textarea id="cust-address" required rows="2" placeholder="Flat No., Street Name, Nearby Landmark..." class="w-full text-xs p-2.5 border border-zinc-200 rounded-lg focus:outline-none focus:border-primary"></textarea>
      </div>

      <!-- Payment Method Dynamic Pricing -->
      <div class="pt-2">
        <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-wider mb-3">Select Payment Method</h2>

        <div class="space-y-2">
          <!-- Prepaid Option -->
          <label onclick="updatePrice('prepaid')" class="flex items-center justify-between p-3 border-2 border-primary rounded-xl cursor-pointer bg-primary/5 transition-all">
            <div class="flex items-center gap-2.5">
              <input type="radio" name="payment_mode" id="pay-prepaid" value="prepaid" checked class="accent-primary" />
              <div>
                <span class="text-xs font-bold text-zinc-900 block">Prepaid (UPI / Card / NetBanking)</span>
                <span class="text-[10px] text-emerald-600 font-bold">✨ Extra ₹50 Instant Discount Applied</span>
              </div>
            </div>
            <span class="text-sm font-black text-primary">₹449</span>
          </label>

          <!-- COD Option -->
          <label onclick="updatePrice('cod')" class="flex items-center justify-between p-3 border border-zinc-200 rounded-xl cursor-pointer hover:border-primary transition-all">
            <div class="flex items-center gap-2.5">
              <input type="radio" name="payment_mode" id="pay-cod" value="cod" class="accent-primary" />
              <div>
                <span class="text-xs font-bold text-zinc-800 block">Cash on Delivery (COD)</span>
                <span class="text-[10px] text-zinc-400">Includes ₹50 Courier COD Handling Fee</span>
              </div>
            </div>
            <span class="text-sm font-bold text-zinc-700">₹549</span>
          </label>
        </div>
      </div>

      <!-- Courier Logistics Partner Details -->
      <div class="bg-zinc-50 border border-zinc-200 rounded-xl p-3 flex items-center gap-3 mt-3">
        <span class="material-symbols-outlined text-primary text-2xl">local_shipping</span>
        <div>
          <h4 class="text-xs font-bold text-zinc-800">Fast Express Delivery</h4>
          <p class="text-[10px] text-zinc-500">Your order will be safely dispatched via Delhivery / Blue Dart courier partner.</p>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="hidden"></button>
    </form>

  </main>

  <!-- Sticky Bottom Bar -->
  <div class="fixed bottom-0 left-0 w-full z-40 bg-white border-t border-zinc-200 p-3 shadow-lg">
    <div class="max-w-[600px] mx-auto flex items-center justify-between gap-4">
      <div>
        <span class="text-[10px] text-zinc-400 uppercase font-bold tracking-wider block">Total Payable</span>
        <span class="text-lg font-black text-zinc-900" id="display-final-price">₹449</span>
      </div>

      <button onclick="triggerSubmit()" class="flex-1 py-3 px-4 rounded-xl bg-primary font-bold text-sm text-white shadow-md hover:bg-primary/90 active:scale-95 transition-all flex items-center justify-center gap-1">
        Place Order <span class="material-symbols-outlined text-sm">check_circle</span>
      </button>
    </div>
  </div>

  <script>
    const basePrice = 499;

    function updatePrice(mode) {
      const prepaidLabel = document.getElementById('pay-prepaid').closest('label');
      const codLabel = document.getElementById('pay-cod').closest('label');
      const priceText = document.getElementById('display-final-price');

      if (mode === 'prepaid') {
        prepaidLabel.className = "flex items-center justify-between p-3 border-2 border-primary rounded-xl cursor-pointer bg-primary/5 transition-all";
        codLabel.className = "flex items-center justify-between p-3 border border-zinc-200 rounded-xl cursor-pointer hover:border-primary transition-all";
        priceText.innerText = "₹449"; // Prepaid Price (₹50 OFF)
      } else {
        codLabel.className = "flex items-center justify-between p-3 border-2 border-primary rounded-xl cursor-pointer bg-primary/5 transition-all";
        prepaidLabel.className = "flex items-center justify-between p-3 border border-zinc-200 rounded-xl cursor-pointer hover:border-primary transition-all";
        priceText.innerText = "₹549"; // COD Price (₹50 Extra)
      }
    }

    function triggerSubmit() {
      document.getElementById('submit-btn').click();
    }

    function handleOrderSubmit(e) {
      e.preventDefault();
      
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const paymentMode = document.querySelector('input[name="payment_mode"]:checked').value;
      const finalAmount = paymentMode === 'prepaid' ? '₹449' : '₹549';
      
      alert(`Thank you, ${name}!\n\nYour order (${finalAmount}) has been placed successfully via ${paymentMode.toUpperCase()}.\n\nYour parcel will be dispatched via Express Courier soon.`);
      
      // Redirect back to homepage
      window.location.href = "home.html";
    }
  </script>

  <script src="app.js" defer></script>
</body>
</html>
