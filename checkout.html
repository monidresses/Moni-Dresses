<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Checkout — MONI DRESSES</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script> <!-- Razorpay SDK -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#b3006a", surface: "#fbf9f8" },
          fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen pb-20">

  <!-- Header -->
  <header class="fixed top-0 left-0 w-full z-40 flex items-center px-4 py-3 bg-white border-b border-zinc-100 shadow-sm">
    <button onclick="history.back()" class="p-1 text-zinc-700">
      <span class="material-symbols-outlined text-2xl">arrow_back</span>
    </button>
    <h1 class="text-base font-extrabold text-primary ml-3 uppercase">Checkout & Payment</h1>
  </header>

  <main class="max-w-[500px] mx-auto pt-16 px-4 space-y-5">

    <!-- Shipping Form -->
    <form id="checkout-form" class="space-y-4">
      <div class="bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm space-y-3">
        <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Delivery Information</h3>
        
        <input type="text" id="cust-name" placeholder="Full Name" required class="w-full p-3 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
        <input type="tel" id="cust-phone" placeholder="Mobile Number (for OTP)" required pattern="[0-9]{10}" class="w-full p-3 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
        <textarea id="cust-address" placeholder="Complete Shipping Address with Pincode" required rows="3" class="w-full p-3 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50"></textarea>
      </div>

      <!-- Payment Method Selection -->
      <div class="bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm space-y-3">
        <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Payment Method</h3>
        
        <label class="flex items-center justify-between p-3 border border-zinc-200 rounded-xl cursor-pointer hover:border-primary transition-colors">
          <div class="flex items-center gap-3">
            <input type="radio" name="paymentMethod" value="razorpay" checked class="accent-primary">
            <div>
              <p class="text-xs font-bold text-zinc-800">Online Payment / UPI / Cards</p>
              <p class="text-[10px] text-emerald-600 font-semibold">Fast & Secure via Razorpay</p>
            </div>
          </div>
          <span class="material-symbols-outlined text-primary text-xl">payments</span>
        </label>

        <label class="flex items-center justify-between p-3 border border-zinc-200 rounded-xl cursor-pointer hover:border-primary transition-colors">
          <div class="flex items-center gap-3">
            <input type="radio" name="paymentMethod" value="cod" class="accent-primary">
            <div>
              <p class="text-xs font-bold text-zinc-800">Cash on Delivery (COD)</p>
              <p class="text-[10px] text-zinc-400">Mobile OTP Verification Required</p>
            </div>
          </div>
          <span class="material-symbols-outlined text-zinc-500 text-xl">local_shipping</span>
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit-btn" class="w-full py-3.5 bg-primary text-white font-bold text-xs rounded-xl shadow-md active:scale-95 transition-all uppercase tracking-wider">
        Proceed to Pay / Order
      </button>
    </form>

  </main>

  <!-- ========================================== -->
  <!-- 🔐 OTP MODAL POPUP FOR COD ORDERS -->
  <!-- ========================================== -->
  <div id="otp-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl space-y-4 text-center">
      <div class="w-12 h-12 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto">
        <span class="material-symbols-outlined text-2xl">sms</span>
      </div>
      
      <div>
        <h3 class="text-sm font-bold text-zinc-800">Verify Mobile Number</h3>
        <p class="text-xs text-zinc-500 mt-1">Enter the 4-digit OTP sent to <span id="otp-phone-display" class="font-bold text-zinc-800"></span></p>
      </div>

      <input type="text" id="otp-input" maxlength="4" placeholder="ENTER OTP" class="w-full text-center tracking-[1em] text-lg font-bold p-3 border border-zinc-300 rounded-xl focus:outline-primary bg-zinc-50">

      <button onclick="verifyCODOTP()" class="w-full py-3 bg-primary text-white font-bold text-xs rounded-xl shadow-md active:scale-95 transition-all uppercase">
        Confirm COD Order
      </button>

      <button onclick="closeOTPModal()" class="text-xs font-bold text-zinc-400 hover:text-zinc-600 block mx-auto">
        Cancel
      </button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- ⚙️ JAVASCRIPT LOGIC (RAZORPAY + COD OTP) -->
  <!-- ========================================== -->
  <script>
    let generatedOTP = null;

    // Total Amount Calculation
    function getCartTotal() {
      const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
      const subtotal = cart.reduce((sum, item) => sum + (Number(item.price) * (Number(item.qty) || 1)), 0);
      return subtotal + 40; // Subtotal + Delivery
    }

    // Clear Cart & Redirect Home
    function completeOrderSuccess(orderId) {
      localStorage.removeItem('cartItems'); // Clear Cart Items
      alert("🎉 Your Order has been placed successfully!\nOrder ID: " + orderId);
      window.location.href = 'home.html';
    }

    // Form Submit Handler
    document.getElementById('checkout-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
      if (cart.length === 0) {
        alert("Your cart is empty!");
        window.location.href = 'home.html';
        return;
      }

      const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      const phone = document.getElementById('cust-phone').value;

      if (selectedMethod === 'razorpay') {
        // --- 1. RAZORPAY PREPAID FLOW ---
        const totalAmount = getCartTotal();
        
        const options = {
          "key": "YOUR_RAZORPAY_KEY", // আপনার Razorpay API Key এখানে বসাবেন
          "amount": totalAmount * 100, // Amount in paise
          "currency": "INR",
          "name": "MONI DRESSES",
          "description": "Prepaid Order Payment",
          "handler": function (response) {
            completeOrderSuccess(response.razorpay_payment_id || "RZP-" + Date.now());
          },
          "prefill": {
            "name": document.getElementById('cust-name').value,
            "contact": phone
          },
          "theme": { "color": "#b3006a" }
        };
        const rzp = new Razorpay(options);
        rzp.open();

      } else {
        // --- 2. COD OTP FLOW ---
        // ৪ অক্ষরের একটি ডেমো/সিমুলেটেড OTP তৈরি (Fast2SMS/Twilio API ইন্টিগ্রেট না থাকলে টেস্টের জন্য)
        generatedOTP = "1234"; // টেস্ট কোড ১২৩৪ (API কানেক্ট করলে মেসেজ যাবে)
        
        document.getElementById('otp-phone-display').innerText = "+91 " + phone;
        document.getElementById('otp-modal').classList.remove('hidden');
        alert("Verification OTP sent to " + phone + "\n(Test OTP: 1234)");
      }
    });

    // Verify OTP for COD
    function verifyCODOTP() {
      const userOTP = document.getElementById('otp-input').value.trim();
      
      if (userOTP === generatedOTP) {
        closeOTPModal();
        completeOrderSuccess("COD-" + Math.floor(100000 + Math.random() * 900000));
      } else {
        alert("❌ Invalid OTP! Please enter the correct code.");
      }
    }

    function closeOTPModal() {
      document.getElementById('otp-modal').classList.add('hidden');
      document.getElementById('otp-input').value = '';
    }
  </script>
</body>
</html>
