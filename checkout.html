<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Checkout — MONI DRESSES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#b3006a", surface: "#fbf9f8" },
          fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] }
        }
      }
    }
  </script>
  <style> body { -webkit-tap-highlight-color: transparent; } </style>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen pb-24">

  <!-- ========================================== -->
  <!-- TOP HEADER -->
  <!-- ========================================== -->
  <header class="fixed top-0 left-0 w-full z-40 flex items-center px-4 py-3 bg-white border-b border-zinc-100 shadow-sm">
    <button onclick="history.back()" class="p-1 text-zinc-700 hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-2xl">arrow_back</span>
    </button>
    <h1 class="text-base font-extrabold text-primary ml-3 uppercase tracking-wider">Checkout & Shipping</h1>
  </header>

  <main class="max-w-[550px] mx-auto pt-16 px-4 space-y-5">
    <form id="checkout-form" class="space-y-4">
      
      <!-- ========================================== -->
      <!-- DELIVERY ADDRESS SECTION -->
      <!-- ========================================== -->
      <div class="bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm space-y-4">
        <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider border-b border-zinc-100 pb-2">Delivery Address</h3>

        <!-- Saved Profile Address Block -->
        <div id="saved-address-section" class="hidden">
          <label class="flex items-start gap-3 p-3 border border-primary/30 bg-primary/5 rounded-xl cursor-pointer transition-all">
            <input type="radio" name="addressSelect" value="saved" id="radio-saved" onchange="toggleAddressOption()" class="mt-1 accent-primary">
            <div class="text-xs space-y-1.5 w-full">
              <div class="flex justify-between items-center">
                <p id="saved-name" class="font-extrabold text-zinc-900 text-sm"></p>
                <span class="text-[9px] bg-emerald-100 text-emerald-700 font-extrabold px-2 py-0.5 rounded-full uppercase tracking-widest">Default</span>
              </div>
              <p id="saved-phone" class="text-zinc-700 font-bold"></p>
              <p id="saved-full-addr" class="text-zinc-500 font-medium leading-relaxed"></p>
            </div>
          </label>
        </div>

        <!-- Add New Address Option -->
        <label class="flex items-center gap-3 p-3 border border-zinc-200 rounded-xl cursor-pointer hover:border-primary transition-colors">
          <input type="radio" name="addressSelect" value="new" id="radio-new" onchange="toggleAddressOption()" class="accent-primary">
          <span class="text-xs font-bold text-zinc-800">+ Add New Address</span>
        </label>

        <!-- New Address Input Fields -->
        <div id="address-inputs" class="space-y-3 pt-2 hidden">
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">Full Name *</label>
              <input type="text" id="cust-name" placeholder="E.g. Full Name" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">Mobile Number *</label>
              <input type="tel" id="cust-phone" pattern="[0-9]{10}" placeholder="10 Digit Number" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
          </div>
          <div>
            <label class="text-[10px] font-bold text-zinc-500 uppercase">Flat / House No. / Building Name *</label>
            <input type="text" id="cust-building" placeholder="House/Building Name" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">Street / Area *</label>
              <input type="text" id="cust-area" placeholder="Area" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">Village / Landmark</label>
              <input type="text" id="cust-village" placeholder="Near Market" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">City / Town *</label>
              <input type="text" id="cust-city" placeholder="City" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">District *</label>
              <input type="text" id="cust-district" placeholder="North 24 Parganas" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">State *</label>
              <input type="text" id="cust-state" placeholder="West Bengal" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
            <div>
              <label class="text-[10px] font-bold text-zinc-500 uppercase">PIN Code *</label>
              <input type="text" id="cust-pin" pattern="[0-9]{6}" placeholder="700001" class="w-full p-2.5 border border-zinc-200 rounded-xl text-xs focus:outline-primary bg-zinc-50/50">
            </div>
          </div>
        </div>
      </div>

      <!-- ========================================== -->
      <!-- PAYMENT METHOD SECTION -->
      <!-- ========================================== -->
      <div class="bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm space-y-3">
        <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Payment Options</h3>
        
        <!-- Prepaid Option -->
        <label class="flex items-center justify-between p-3 border border-zinc-200 rounded-xl cursor-pointer hover:border-primary transition-colors">
          <div class="flex items-center gap-3">
            <input type="radio" name="paymentMethod" value="razorpay" onchange="updateOrderSummary()" checked class="accent-primary">
            <div>
              <p class="text-xs font-bold text-zinc-800">Online Payment (UPI, Cards)</p>
              <p class="text-[10px] text-emerald-600 font-semibold">Extra Discount on Prepaid Order</p>
            </div>
          </div>
          <span class="material-symbols-outlined text-primary text-xl">payments</span>
        </label>
        
        <!-- COD Option -->
        <label class="flex items-center justify-between p-3 border border-zinc-200 rounded-xl cursor-pointer hover:border-primary transition-colors">
          <div class="flex items-center gap-3">
            <input type="radio" name="paymentMethod" value="cod" onchange="updateOrderSummary()" class="accent-primary">
            <div>
              <p class="text-xs font-bold text-zinc-800">Cash on Delivery (COD)</p>
              <p class="text-[10px] text-zinc-400">Standard Delivery Charge Applies</p>
            </div>
          </div>
          <span class="material-symbols-outlined text-zinc-500 text-xl">local_shipping</span>
        </label>
      </div>

      <!-- ========================================== -->
      <!-- ORDER SUMMARY & BILLING SECTION -->
      <!-- ========================================== -->
      <div class="bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm space-y-3">
        <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider border-b border-zinc-100 pb-2">Order Summary</h3>
        <div class="flex justify-between text-xs font-bold text-zinc-600">
          <span>Items Subtotal</span>
          <span id="summary-subtotal">₹0</span>
        </div>
        <div class="flex justify-between text-xs font-bold text-zinc-600">
          <span>Delivery Charge</span>
          <span id="summary-delivery" class="text-emerald-600">FREE</span>
        </div>
        <div class="flex justify-between text-sm font-black text-zinc-900 border-t border-zinc-100 pt-3">
          <span>Grand Total</span>
          <span id="summary-total" class="text-primary text-base">₹0</span>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="w-full py-4 bg-primary text-white font-extrabold text-xs rounded-xl shadow-md active:scale-95 transition-all uppercase tracking-wider">
        Confirm & Place Order
      </button>
    </form>
  </main>

  <!-- ========================================== -->
  <!-- FIREBASE OTP MODAL FOR COD VERIFICATION -->
  <!-- ========================================== -->
  <div id="otp-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-center">
      <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto">
        <span class="material-symbols-outlined text-4xl">sms</span>
      </div>
      <div>
        <h3 class="text-sm font-bold text-zinc-900">Verify Mobile Number</h3>
        <p class="text-xs text-zinc-500 mt-1">Enter 6-digit OTP sent to <span id="otp-phone-display" class="font-bold text-zinc-800"></span></p>
      </div>
      <input type="text" id="otp-input" maxlength="6" placeholder="123456" class="w-full text-center tracking-[0.5em] text-lg font-bold p-3 border border-zinc-300 rounded-xl focus:outline-primary bg-zinc-50">
      <button onclick="verifyCODOTP()" class="w-full py-3.5 bg-primary text-white font-extrabold text-xs rounded-xl shadow-md active:scale-95 transition-all uppercase">Verify & Confirm Order</button>
      <button onclick="closeModal('otp-modal')" class="text-xs font-bold text-zinc-400 hover:text-zinc-600 block mx-auto">Cancel</button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- PROFESSIONAL SUCCESS MODAL (WITH CHECKMARK) -->
  <!-- ========================================== -->
  <div id="success-modal" class="fixed inset-0 z-[200] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden transition-opacity">
    <div class="bg-white w-full max-w-[280px] rounded-3xl p-6 text-center shadow-2xl scale-95 transition-transform duration-200">
      <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined text-4xl">check_circle</span>
      </div>
      <h3 class="text-sm font-bold text-zinc-900 mb-1">Success!</h3>
      <p id="success-message" class="text-xs text-zinc-500 mb-6">Order Placed Successfully!</p>
      <button onclick="handleModalAction()" class="w-full py-3 bg-primary text-white font-bold text-xs rounded-xl hover:opacity-90 transition-all uppercase tracking-wider">OK</button>
    </div>
  </div>

  <!-- Hidden reCAPTCHA Container for Firebase -->
  <div id="recaptcha-container"></div>

  <!-- ========================================== -->
  <!-- CORE JAVASCRIPT & FIREBASE LOGIC -->
  <!-- ========================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZdG23Io-oMElZ5XVmhVLd87-sq136dhY",
      authDomain: "moni-dresses-db.firebaseapp.com",
      projectId: "moni-dresses-db",
      storageBucket: "moni-dresses-db.firebasestorage.app",
      messagingSenderId: "24076547918",
      appId: "1:24076547918:web:6cae50157f9c6749ff501f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let finalOrderAmount = 0; 
    let windowConfirmationResult = null;
    let successRedirectUrl = "order-success.html";

    // Initialize invisible reCAPTCHA
    window.addEventListener('DOMContentLoaded', () => {
      window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
        'size': 'invisible',
        'callback': (response) => {}
      });
      loadSavedProfileAddress();
      updateOrderSummary();
    });

    // Professional Modal Controller
    function showSuccessMessageModal(message, callback = null) {
      document.getElementById('success-message').innerText = message;
      const modal = document.getElementById('success-modal');
      modal.classList.remove('hidden');
      setTimeout(() => modal.querySelector('div').classList.remove('scale-95'), 10);
      window.modalActionCallback = callback;
    }

    window.handleModalAction = function() {
      const modal = document.getElementById('success-modal');
      modal.querySelector('div').classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
        if (window.modalActionCallback) window.modalActionCallback();
      }, 200);
    }

    // 1. ADMIN DELIVERY CHARGES
    function getAdminDeliveryCharges() {
      const adminSettings = JSON.parse(localStorage.getItem('adminSettings')) || {
        prepaidDelivery: 0, 
        codDelivery: 60     
      };
      return adminSettings;
    }

    // 2. ORDER CALCULATION & SUMMARY UPDATE
    function getCartSubtotal() {
      const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
      return cart.reduce((sum, item) => sum + (Number(item.price) * (Number(item.qty) || 1)), 0);
    }

    window.updateOrderSummary = function() {
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      const charges = getAdminDeliveryCharges();
      const subtotal = getCartSubtotal();
      
      const deliveryFee = paymentMethod === 'razorpay' ? Number(charges.prepaidDelivery) : Number(charges.codDelivery);
      finalOrderAmount = subtotal + deliveryFee;

      document.getElementById('summary-subtotal').innerText = `₹${subtotal}`;
      
      if (deliveryFee === 0) {
        document.getElementById('summary-delivery').innerText = "FREE";
        document.getElementById('summary-delivery').classList.add("text-emerald-600");
        document.getElementById('summary-delivery').classList.remove("text-zinc-900");
      } else {
        document.getElementById('summary-delivery').innerText = `+ ₹${deliveryFee}`;
        document.getElementById('summary-delivery').classList.remove("text-emerald-600");
        document.getElementById('summary-delivery').classList.add("text-zinc-900");
      }

      document.getElementById('summary-total').innerText = `₹${finalOrderAmount}`;
      document.getElementById('submit-btn').innerText = `Pay ₹${finalOrderAmount} & Place Order`;
    }

    // 3. PROFILE ADDRESS LOGIC
    function loadSavedProfileAddress() {
      const savedUser = JSON.parse(localStorage.getItem('userProfile'));
      const savedSection = document.getElementById('saved-address-section');
      const radioSaved = document.getElementById('radio-saved');
      const radioNew = document.getElementById('radio-new');

      if (savedUser && savedUser.address && savedUser.address.city) {
        document.getElementById('saved-name').innerText = savedUser.name || "Customer Name";
        document.getElementById('saved-phone').innerText = "+91 " + (savedUser.phone || "");
        
        const addr = savedUser.address;
        const villageText = addr.village ? `${addr.village}, ` : '';
        document.getElementById('saved-full-addr').innerText = 
          `${addr.building}, ${addr.area}, ${villageText}${addr.city}, ${addr.district}, ${addr.state} - ${addr.pin}`;
        
        savedSection.classList.remove('hidden');
        radioSaved.checked = true;
        toggleAddressOption(); 
      } else {
        savedSection.classList.add('hidden');
        radioNew.checked = true;
        toggleAddressOption();
      }
    }

    window.toggleAddressOption = function() {
      const addressChoice = document.querySelector('input[name="addressSelect"]:checked')?.value;
      const addressInputsDiv = document.getElementById('address-inputs');
      const inputs = addressInputsDiv.querySelectorAll('input');

      if (addressChoice === 'saved') {
        addressInputsDiv.classList.add('hidden');
        inputs.forEach(input => input.removeAttribute('required'));
      } else {
        addressInputsDiv.classList.remove('hidden');
        inputs.forEach(input => {
          if (input.id !== 'cust-village') input.setAttribute('required', 'true');
        });
      }
    }

    // 4. SAVE ORDER TO HISTORY & REDIRECT
    function saveOrderToHistory(orderId, totalPaid) {
      const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
      if (cart.length === 0) return;

      const newOrder = {
        orderId: orderId,
        date: new Date().toLocaleDateString('en-IN'),
        items: cart,
        total: totalPaid, 
        status: "Processing"
      };

      let orderHistory = JSON.parse(localStorage.getItem('orderHistory')) || [];
      orderHistory.unshift(newOrder);
      localStorage.setItem('orderHistory', JSON.stringify(orderHistory));
    }

    function processOrderSuccess(orderId, totalPaid) {
      saveOrderToHistory(orderId, totalPaid);
      localStorage.removeItem('cartItems'); 
      localStorage.setItem('latestOrderId', orderId); 
      
      showSuccessMessageModal("Order Placed Successfully!", () => {
        window.location.href = successRedirectUrl;
      });
    }

    // 5. FORM SUBMIT (RAZORPAY & FIREBASE COD OTP)
    document.getElementById('checkout-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
      if (cart.length === 0) {
        showSuccessMessageModal("Your cart is empty!");
        return;
      }

      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      const addressChoice = document.querySelector('input[name="addressSelect"]:checked').value;
      
      let phoneInput = "";
      let nameInput = "";
      
      if (addressChoice === 'saved') {
        const savedUser = JSON.parse(localStorage.getItem('userProfile'));
        phoneInput = savedUser.phone;
        nameInput = savedUser.name;
      } else {
        phoneInput = document.getElementById('cust-phone').value;
        nameInput = document.getElementById('cust-name').value;
      }

      if (!phoneInput || phoneInput.length !== 10) {
        showSuccessMessageModal("Please provide a valid 10-digit mobile number!");
        return;
      }

      if (paymentMethod === 'razorpay') {
        const options = {
          "key": "YOUR_RAZORPAY_KEY", 
          "amount": finalOrderAmount * 100, 
          "currency": "INR",
          "name": "MONI DRESSES",
          "description": "Prepaid Order Payment",
          "handler": function (response) {
            const finalId = "MD-RZP-" + Math.floor(100000 + Math.random() * 900000);
            processOrderSuccess(finalId, finalOrderAmount);
          },
          "prefill": { "name": nameInput, "contact": phoneInput },
          "theme": { "color": "#b3006a" }
        };
        const rzp = new Razorpay(options);
        rzp.open();
      } else {
        // Trigger Firebase OTP for COD to the customer's phone number
        const fullPhone = "+91" + phoneInput;
        document.getElementById('otp-phone-display').innerText = fullPhone;
        
        const appVerifier = window.recaptchaVerifier;
        signInWithPhoneNumber(auth, fullPhone, appVerifier)
          .then((confirmationResult) => {
            windowConfirmationResult = confirmationResult;
            document.getElementById('otp-modal').classList.remove('hidden');
          })
          .catch((error) => {
            console.error("SMS OTP Error:", error);
            showSuccessMessageModal("Failed to send OTP: " + error.message);
          });
      }
    });

    // 6. VERIFY COD OTP WITH FIREBASE
    window.verifyCODOTP = function() {
      const userOTP = document.getElementById('otp-input').value.trim();
      if (userOTP.length < 6) {
        showSuccessMessageModal("Please enter the complete 6-digit OTP!");
        return;
      }

      if (windowConfirmationResult) {
        windowConfirmationResult.confirm(userOTP)
          .then((result) => {
            closeModal('otp-modal');
            const finalId = "MD-COD-" + Math.floor(100000 + Math.random() * 900000);
            processOrderSuccess(finalId, finalOrderAmount);
          })
          .catch((error) => {
            console.error("Invalid OTP:", error);
            showSuccessMessageModal("Invalid OTP! Please check and try again.");
          });
      } else {
        showSuccessMessageModal("Session expired. Please try placing the order again.");
      }
    }

    window.closeModal = function(id) {
      document.getElementById(id).classList.add('hidden');
    }
  </script>
</body>
</html>
