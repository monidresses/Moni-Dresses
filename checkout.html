<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — MONI DRESSES</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{primary:'#b3006a',surface:'#fbf9f8'}}}}</script></head>
<body class="bg-surface text-zinc-900 min-h-screen pb-24"><header class="fixed top-0 left-0 w-full z-40 flex items-center px-4 py-3 bg-white border-b shadow-sm"><button onclick="history.back()" class="p-1">←</button><h1 class="text-base font-extrabold text-primary ml-3 uppercase">Checkout & Shipping</h1></header>
<main class="max-w-[550px] mx-auto pt-16 px-4"><form id="checkout-form" class="space-y-4">
<section class="bg-white p-4 rounded-2xl border space-y-3"><h3 class="text-xs font-bold text-zinc-400 uppercase">Delivery Address</h3><div class="grid grid-cols-2 gap-2"><input id="cust-name" placeholder="Full Name *" class="p-2 border rounded-xl" required><input id="cust-phone" inputmode="numeric" maxlength="10" placeholder="Mobile Number *" class="p-2 border rounded-xl" required></div><input id="cust-building" placeholder="House / Building *" class="w-full p-2 border rounded-xl" required><input id="cust-area" placeholder="Street / Area *" class="w-full p-2 border rounded-xl" required><input id="cust-city" placeholder="City / Town *" class="w-full p-2 border rounded-xl" required><input id="cust-pin" inputmode="numeric" maxlength="6" placeholder="PIN Code *" class="w-full p-2 border rounded-xl" required></section>
<section class="bg-white p-4 rounded-2xl border space-y-3"><h3 class="text-xs font-bold text-zinc-400 uppercase">Payment</h3><label class="block p-3 border rounded-xl"><input type="radio" name="paymentMethod" value="razorpay" checked onchange="updateOrderSummary()"> Online Payment (UPI, Cards)</label><label class="block p-3 border rounded-xl"><input type="radio" name="paymentMethod" value="cod" onchange="updateOrderSummary()"> Cash on Delivery</label></section>
<section class="bg-white p-4 rounded-2xl border space-y-3"><h3 class="text-xs font-bold text-zinc-400 uppercase">Order Summary</h3><div class="flex justify-between"><span>Subtotal</span><span id="summary-subtotal">₹0</span></div><div class="flex justify-between"><span>Delivery</span><span id="summary-delivery">FREE</span></div><div class="flex justify-between font-black border-t pt-3"><span>Total</span><span id="summary-total" class="text-primary">₹0</span></div></section><button type="submit" id="submit-btn" class="w-full py-4 bg-primary text-white font-extrabold rounded-xl">Place Order</button></form></main>
<div id="recaptcha-container"></div><div id="otp-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4"><h3 class="font-bold">Verify Mobile Number</h3><input id="otp-input" maxlength="6" class="w-full p-3 border rounded-xl" placeholder="123456"><button onclick="verifyCODOTP()" class="w-full py-3 bg-primary text-white rounded-xl">Verify & Confirm</button><button onclick="closeModal('otp-modal')" class="w-full">Cancel</button></div></div>
<script type="module">import {auth,db} from './common.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';import{RecaptchaVerifier,signInWithPhoneNumber}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{persistOrder}from'./checkout.js';let amount=0,result=null,recaptcha=null,settings={};const cart=()=>JSON.parse(localStorage.getItem('cartItems')||'[]');const subtotal=()=>cart().reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||i.quantity||1),0);async function load(){const s=await getDoc(doc(db,'siteConfig','public'));if(s.exists())settings=s.data()||{};}function fee(){const m=document.querySelector('[name="paymentMethod"]:checked')?.value;return Number(m==='cod'?(settings.codDelivery??settings.deliveryCharge??0):(settings.prepaidDelivery??settings.deliveryCharge??0));}window.updateOrderSummary=()=>{const sub=subtotal(),f=fee();amount=sub+f;document.getElementById('summary-subtotal').textContent=`₹${sub}`;document.getElementById('summary-delivery').textContent=f?`₹${f}`:'FREE';document.getElementById('summary-total').textContent=`₹${amount}`;document.getElementById('submit-btn').textContent=`Place Order • ₹${amount}`};function address(){return{name:document.getElementById('cust-name').value.trim(),phone:document.getElementById('cust-phone').value.trim(),address:[document.getElementById('cust-building').value,document.getElementById('cust-area').value].filter(Boolean).join(', '),city:document.getElementById('cust-city').value.trim(),pinCode:document.getElementById('cust-pin').value.trim()}};async function cod(){const a=address(),id=`MD-COD-${Date.now()}`;await persistOrder(id,amount,'cod',{status:'pending',address:a});localStorage.setItem('latestOrderId',id);localStorage.removeItem('cartItems');location.href='order-success.html'}window.verifyCODOTP=async()=>{try{await result.confirm(document.getElementById('otp-input').value.trim());document.getElementById('otp-modal').classList.add('hidden');await cod()}catch(e){alert('Invalid OTP.')}};window.closeModal=id=>document.getElementById(id).classList.add('hidden');document.getElementById('checkout-form').addEventListener('submit',async e=>{e.preventDefault();if(!auth.currentUser){location.href='login.html?redirect=checkout.html';return}if(!cart().length){alert('Your cart is empty.');return}const a=address();if(!a.name||!/^[0-9]{10}$/.test(a.phone)||!a.city||!/^[0-9]{6}$/.test(a.pinCode)){alert('Please enter a valid delivery address.');return}if(document.querySelector('[name="paymentMethod"]:checked').value==='cod'){try{if(!recaptcha)recaptcha=new RecaptchaVerifier(auth,'recaptcha-container',{size:'invisible'});result=await signInWithPhoneNumber(auth,'+91'+a.phone,recaptcha);document.getElementById('otp-modal').classList.remove('hidden')}catch(err){alert(err.message||'Unable to send OTP.')}}else alert('Razorpay Cloud Function is awaiting API credentials.')});addEventListener('DOMContentLoaded',async()=>{try{await load()}catch(e){console.error(e)}updateOrderSummary()});</script></body></html>
