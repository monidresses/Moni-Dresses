<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title id="page-title">MONI DRESSES</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet"/>

  <style>
    body {
      background-color: #09090b;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    .font-brand {
      font-family: 'Bodoni Moda', serif;
    }

    /* Pulse Logo Animation */
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .animate-pulse-logo {
      animation: pulseLogo 2.5s infinite ease-in-out;
    }

    /* 5 Second Progress Bar Animation */
    @keyframes progressWidth {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .animate-progress {
      animation: progressWidth 5s linear forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-8 overflow-hidden select-none">

  <!-- Empty Header Spacer -->
  <div></div>

  <!-- Center Content: Dynamic Brand Details -->
  <div class="flex flex-col items-center text-center my-auto animate-pulse-logo">
    <div class="w-24 h-24 bg-gradient-to-tr from-[#b3006a] to-[#dc1985] rounded-3xl flex items-center justify-center shadow-2xl mb-6 border border-white/10">
      <span id="brand-logo-letter" class="font-brand text-4xl font-black text-white tracking-widest">M</span>
    </div>
    <h1 id="brand-name" class="font-brand text-3xl sm:text-4xl font-black tracking-widest text-white mb-3 uppercase">
      MONI DRESSES
    </h1>
    <p id="brand-subtitle" class="text-zinc-400 text-xs font-light tracking-widest uppercase">
      Crafted Comfort & Elegant Style
    </p>
  </div>

  <!-- Bottom Progress Line -->
  <div class="w-full max-w-xs flex flex-col items-center gap-3 mb-6">
    <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
      <div class="bg-gradient-to-r from-[#b3006a] to-[#dc1985] h-full animate-progress"></div>
    </div>
    <p class="text-[11px] text-zinc-500 uppercase tracking-widest font-medium">Entering Store...</p>
  </div>

  <!-- Dynamic Data Fetch & Redirect Script -->
  <script>
    /**
     * Fetches brand settings from the backend API.
     * Updates the DOM elements dynamically if data is found.
     */
    async function loadDynamicSettings() {
      try {
        // Replace with your actual Render backend URL
        const response = await fetch('https://monidresses-backend.onrender.com/api/settings');
        
        if (response.ok) {
          const data = await response.json();
          
          // Apply changes if data exists
          if (data.brandName) {
            document.getElementById('brand-name').innerText = data.brandName;
            document.getElementById('page-title').innerText = data.brandName;
          }
          if (data.subtitle) {
            document.getElementById('brand-subtitle').innerText = data.subtitle;
          }
          if (data.logoLetter) {
            document.getElementById('brand-logo-letter').innerText = data.logoLetter;
          }
        }
      } catch (error) {
        // Silently fail to defaults if backend is unreachable
        console.warn('Could not load dynamic settings. Using default brand info.', error);
      }
    }

    // Initialize data fetch on page load
    loadDynamicSettings();

    // Redirect to home page after 5 seconds
    setTimeout(function() {
      window.location.href = "home.html";
    }, 5000);
  </script>

</body>
</html>
