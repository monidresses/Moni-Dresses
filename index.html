<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #eaeaea;">

    <!-- হেডার -->
    <div style="text-align: center; background: #6A0572; color: #fff; padding: 15px; border-radius: 12px; margin-bottom: 20px;">
        <h2 style="margin: 0; font-size: 20px;">Moni Dresses Wholesale Order</h2>
        <p style="margin: 5px 0 0; font-size: 12px; color: #f2d6f5;">পাইকারি অর্ডারের জন্য নিচের ফর্মটি পূরণ করুন</p>
    </div>

    <form onsubmit="sendWholesaleToWhatsApp(event)" style="display: flex; flex-direction: column; gap: 12px; font-size: 13px; color: #333;">

        <!-- দোকানের নাম -->
        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 4px;">দোকান / ফার্মের নাম (Shop Name) *</label>
            <input type="text" id="ws_shop" placeholder="उदा. Roy Textiles" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
        </div>

        <!-- জিএসটি নম্বর (Optional) -->
        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 4px;">GSTIN (Optional)</label>
            <input type="text" id="ws_gst" placeholder="যদি থাকে (যেমন: 19AAAAA0000A1Z5)" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
        </div>

        <!-- নাম ও ফোন নম্বর -->
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label style="font-weight: bold; display: block; margin-bottom: 4px;">আপনার নাম *</label>
                <input type="text" id="ws_name" placeholder="নাম লিখুন" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
            </div>
            <div style="flex: 1;">
                <label style="font-weight: bold; display: block; margin-bottom: 4px;">মোবাইল নম্বর *</label>
                <input type="tel" id="ws_phone" placeholder="10-digit number" required pattern="[0-9]{10}" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
            </div>
        </div>

        <!-- ঠিকানা -->
        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 4px;">ডেলিভারি ঠিকানা ও পিনকোড *</label>
            <textarea id="ws_address" rows="2" placeholder="পূর্ণাঙ্গ ঠিকানা ও পিনকোড লিখুন" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;"></textarea>
        </div>

        <!-- প্রোডাক্ট সিলেকশন -->
        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 4px;">পছন্দের প্রোডাক্ট নির্বাচন করুন *</label>
            <select id="ws_product" onchange="updatePriceInfo()" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-weight: bold; color: #6A0572;">
                <option value="">-- প্রোডাক্ট বেছে নিন --</option>
                <option value="Pure Cotton Blouse" data-price="200">Pure Cotton Blouse (পাইকারি: ₹২০০/পিস)</option>
                <option value="Designer Readymade Blouse" data-price="250">Designer Readymade Blouse (পাইকারি: ₹২৫০/পিস)</option>
                <option value="Cotton Petticoat" data-price="120">Cotton Petticoat (পাইকারি: ₹১২০/পিস)</option>
            </select>
        </div>

        <!-- পাইকারি রেট ডিসপ্লে -->
        <div id="price_display" style="display: none; background: #fdf5ff; padding: 10px; border-radius: 8px; border: 1px solid #6A0572; font-size: 12px; color: #6A0572; font-weight: bold;">
            📌 নির্বাচিত প্রোডাক্টের পাইকারি দর: <span id="unit_price">₹0</span> / পিস (সর্বনিম্ন ২৫ পিস)
        </div>

        <!-- অর্ডারের বাজেট / টাকার পরিমাণ -->
        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 4px;">কত টাকার প্রোডাক্ট কিনতে চান? *</label>
            <select id="ws_budget" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
                <option value="">-- বাজেট নির্বাচন করুন --</option>
                <option value="₹5,000 - ₹10,000">₹৫,০০০ - ₹১০,০০০ (ট্রায়াল অর্ডার)</option>
                <option value="₹10,000 - ₹25,000">₹১০,০০০ - ₹২৫,০০০ (স্ট্যান্ডার্ড বাজেট)</option>
                <option value="₹25,000 - ₹50,000">₹২৫,০০০ - ₹৫০,000 (বাল্ক বাজেট)</option>
                <option value="₹50,000+">₹৫০,০০০ এর বেশি (মেগা হোলসেল)</option>
            </select>
        </div>

        <!-- সাবমিট বাটন -->
        <button type="submit" style="background-color: #25D366; color: white; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 10px; shadow: 0 4px 6px rgba(0,0,0,0.1);">
            📲 Submit & Send Order to WhatsApp
        </button>

    </form>
</div>

<!-- জাভাস্ক্রিপ্ট কোড (WhatsApp অটোমেশন) -->
<script>
    function updatePriceInfo() {
        const select = document.getElementById('ws_product');
        const selectedOption = select.options[select.selectedIndex];
        const price = selectedOption.getAttribute('data-price');
        const display = document.getElementById('price_display');
        
        if (price) {
            document.getElementById('unit_price').innerText = '₹' + price;
            display.style.display = 'block';
        } else {
            display.style.display = 'none';
        }
    }

    function sendWholesaleToWhatsApp(e) {
        e.preventDefault();
        
        // আপনার ওয়াটসঅ্যাপ নাম্বার (এখানে নিজের নাম্বার বসাবেন)
        const myPhoneNumber = "919832XXXXXX"; 

        const shop = document.getElementById('ws_shop').value;
        const gst = document.getElementById('ws_gst').value || "N/A";
        const name = document.getElementById('ws_name').value;
        const phone = document.getElementById('ws_phone').value;
        const address = document.getElementById('ws_address').value;
        const product = document.getElementById('ws_product').value;
        const budget = document.getElementById('ws_budget').value;

        // মেসেজ ফরম্যাট
        let message = `* New Wholesale Inquiry - Moni Dresses*%0A%0A` +
            `🏢 *Shop Name:* ${shop}%0A` +
            `🆔 *GST No:* ${gst}%0A` +
            `👤 *Owner Name:* ${name}%0A` +
            `📞 *Phone:* ${phone}%0A` +
            `📍 *Address:* ${address}%0A%0A` +
            `📦 *Product Requested:* ${product}%0A` +
            `💰 *Target Budget:* ${budget}%0A%0A` +
            `_Sent from Website Wholesale Form_`;

        window.open(`https://wa.me/${myPhoneNumber}?text=${message}`, '_blank');
    }
</script>
