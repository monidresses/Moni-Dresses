<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Order Successful — MONI DRESSES</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#b3006a", surface: "#fbf9f8" },
          fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-sm rounded-3xl p-8 shadow-sm border border-zinc-200 text-center space-y-6">
    
    <!-- Animated Check Icon -->
    <div class="w-24 h-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto shadow-inner">
      <span class="material-symbols-outlined text-6xl font-black">check_circle</span>
    </div>

    <!-- Success Message -->
    <div class="space-y-1.5">
      <h2 class="text-xl font-extrabold text-zinc-900">Order Confirmed!</h2>
      <p class="text-xs text-zinc-500 leading-relaxed">Thank you for your purchase. Your order has been placed successfully.</p>
    </div>

    <!-- Order ID Box -->
    <div class="bg-zinc-50 border border-zinc-200 p-4 rounded-2xl space-y-1">
      <p class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider">Your Order ID</p>
      <p id="display-order-id" class="text-lg font-black text-primary tracking-wide">Loading...</p>
    </div>

    <p class="text-[11px] text-zinc-400 font-medium">You can track your order status from your account.</p>

    <!-- Navigation Buttons -->
    <div class="space-y-3 pt-4 border-t border-zinc-100">
      <a href="account.html" class="block w-full py-4 bg-primary text-white font-bold text-xs rounded-xl shadow-md active:scale-95 transition-all uppercase tracking-wider">
        Track Your Order
      </a>
      <a href="home.html" class="block w-full py-3 text-zinc-600 font-bold text-xs hover:text-zinc-900 transition-colors">
        Continue Shopping
      </a>
    </div>

  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const orderId = localStorage.getItem('latestOrderId') || "MD-ERROR-000";
      document.getElementById('display-order-id').innerText = orderId;
    });
  </script>
</body>
</html>
