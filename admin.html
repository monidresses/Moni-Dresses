<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moni Dresses | Admin App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandRed: '#D62828',
                        brandPurple: '#6A0572',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans pb-10">

    <!-- Header -->
    <header class="bg-brandPurple text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
        <div>
            <span class="bg-brandRed text-[10px] font-black px-2 py-0.5 rounded uppercase">Admin Panel</span>
            <h1 class="text-base font-bold leading-tight mt-0.5">Moni Dresses</h1>
        </div>
        <button onclick="alert('Logged Out')" class="text-xs bg-red-600 px-3 py-1.5 rounded font-bold">Logout</button>
    </header>

    <!-- Mobile Top Navigation Tabs -->
    <div class="bg-white border-b border-gray-200 sticky top-14 z-20 shadow-sm flex justify-around">
        <button id="btn-add-product" onclick="showSection('add-product')" class="flex-1 py-3 text-xs font-bold text-brandPurple border-b-2 border-brandPurple text-center">
            <i class="fa-solid fa-plus-circle block text-base mb-1"></i> Add Product
        </button>
        <button id="btn-view-orders" onclick="showSection('view-orders')" class="flex-1 py-3 text-xs font-bold text-gray-500 border-b-2 border-transparent text-center">
            <i class="fa-solid fa-list-check block text-base mb-1"></i> Orders
        </button>
        <button id="btn-gateways" onclick="showSection('gateways')" class="flex-1 py-3 text-xs font-bold text-gray-500 border-b-2 border-transparent text-center">
            <i class="fa-solid fa-key block text-base mb-1"></i> API Keys
        </button>
    </div>

    <!-- Main Form Container -->
    <main class="p-4 max-w-lg mx-auto">

        <!-- 1. ADD PRODUCT SECTION -->
        <div id="sec-add-product" class="space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
                <h2 class="text-sm font-bold text-brandPurple flex items-center gap-2 border-b pb-2">
                    <i class="fa-solid fa-box"></i> Add New Product to Store
                </h2>
                
                <form class="space-y-3" onsubmit="event.preventDefault(); alert('Product Added!');">
                    <div>
                        <label class="text-xs font-bold text-gray-600">Product Title</label>
                        <input type="text" placeholder="e.g. Pure Cotton Blouse" class="w-full border border-gray-300 p-2.5 rounded-xl text-xs mt-1 focus:outline-none focus:border-brandPurple" required>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-gray-600">Category</label>
                        <select class="w-full border border-gray-300 p-2.5 rounded-xl text-xs mt-1 bg-white focus:outline-none focus:border-brandPurple">
                            <option>Cotton Blouse</option>
                            <option>Petticoat</option>
                            <option>Kanjivaram Saree</option>
                            <option>Bundle Pack</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold text-gray-600">Price (₹)</label>
                            <input type="number" placeholder="299" class="w-full border border-gray-300 p-2.5 rounded-xl text-xs mt-1 focus:outline-none focus:border-brandPurple" required>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-600">Stock (Units)</label>
                            <input type="number" placeholder="50" class="w-full border border-gray-300 p-2.5 rounded-xl text-xs mt-1 focus:outline-none focus:border-brandPurple" required>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-gray-600">Image URL</label>
                        <input type="url" placeholder="https://..." class="w-full border border-gray-300 p-2.5 rounded-xl text-xs mt-1 focus:outline-none focus:border-brandPurple" required>
                    </div>

                    <button type="submit" class="w-full bg-brandPurple text-white font-bold py-3 rounded-xl text-xs shadow-md active:scale-95 transition">
                        Publish Product
                    </button>
                </form>
            </div>
        </div>

        <!-- 2. ORDERS SECTION -->
        <div id="sec-view-orders" class="hidden space-y-3">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Live Customer Orders</h2>
            
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-2">
                <div class="flex justify-between items-center border-b pb-2">
                    <span class="font-black text-xs text-brandPurple">#MD-9082</span>
                    <span class="bg-green-100 text-green-800 text-[10px] px-2 py-0.5 font-bold rounded">Packed</span>
                </div>
                <div class="text-xs space-y-1">
                    <p class="font-bold text-gray-800">Cotton Blouse Pack (x2)</p>
                    <p class="text-gray-500">Amount: <span class="font-bold text-gray-800">₹598</span> (COD)</p>
                    <p class="text-xs text-green-700 font-semibold"><i class="fa-solid fa-truck-fast"></i> Chakdaha Franchise Hub</p>
                </div>
            </div>
        </div>

        <!-- 3. API KEYS SECTION -->
        <div id="sec-gateways" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
                <h2 class="text-sm font-bold text-brandPurple flex items-center gap-2 border-b pb-2">
                    <i class="fa-solid fa-key"></i> Payment & Shipping Settings
                </h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-bold text-gray-600">Razorpay Key ID</label>
                        <input type="text" placeholder="rzp_live_xxxxxxxx" class="w-full border border-gray-300 p-2.5 rounded-xl text-xs mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-600">Shiprocket API Token</label>
                        <input type="password" value="****************" class="w-full border border-gray-300 p-2.5 rounded-xl text-xs mt-1">
                    </div>
                    <button onclick="alert('API Keys Saved!')" class="w-full bg-brandRed text-white font-bold py-3 rounded-xl text-xs shadow-md">
                        Save Keys
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Tab Switcher JS -->
    <script>
        function showSection(sec) {
            ['add-product', 'view-orders', 'gateways'].forEach(s => {
                document.getElementById(`sec-${s}`).classList.add('hidden');
                const btn = document.getElementById(`btn-${s}`);
                btn.classList.remove('text-brandPurple', 'border-brandPurple');
                btn.classList.add('text-gray-500', 'border-transparent');
            });
            
            document.getElementById(`sec-${sec}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`btn-${sec}`);
            activeBtn.classList.remove('text-gray-500', 'border-transparent');
            activeBtn.classList.add('text-brandPurple', 'border-brandPurple');
        }
    </script>
</body>
</html>
