<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Admin Dashboard — MONI DRESSES</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#b3006a", surface: "#f1f5f9", panel: "#ffffff" },
          fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen">

  <!-- Admin Header -->
  <header class="bg-primary text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-3xl">admin_panel_settings</span>
        <h1 class="text-lg font-extrabold tracking-wider">MONI DRESSES ADMIN</h1>
      </div>
      <a href="home.html" class="text-xs font-bold bg-white/20 px-4 py-2 rounded-lg hover:bg-white/30 transition">
        View Store
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- LEFT COLUMN: Delivery Settings -->
    <div class="md:col-span-1 space-y-6">
      
      <div class="bg-panel p-5 rounded-2xl shadow-sm border border-zinc-200">
        <h2 class="text-sm font-extrabold text-zinc-800 flex items-center gap-2 border-b border-zinc-100 pb-3 mb-4">
          <span class="material-symbols-outlined text-primary">local_shipping</span>
          Delivery Charge Control
        </h2>
        
        <form id="delivery-settings-form" class="space-y-4">
          <div>
            <label class="block text-[11px] font-bold text-zinc-500 uppercase mb-1">Prepaid Delivery Charge (₹)</label>
            <input type="number" id="prepaid-charge" required class="w-full p-2.5 border border-zinc-300 rounded-xl text-sm font-bold focus:outline-primary bg-zinc-50">
            <p class="text-[10px] text-emerald-600 mt-1 font-semibold">Keep 0 for Free Delivery</p>
          </div>
          
          <div>
            <label class="block text-[11px] font-bold text-zinc-500 uppercase mb-1">COD Delivery Charge (₹)</label>
            <input type="number" id="cod-charge" required class="w-full p-2.5 border border-zinc-300 rounded-xl text-sm font-bold focus:outline-primary bg-zinc-50">
          </div>

          <button type="submit" class="w-full py-3 bg-primary text-white font-bold text-xs rounded-xl shadow active:scale-95 transition-all uppercase">
            Update Charges
          </button>
        </form>
      </div>

    </div>

    <!-- RIGHT COLUMN: Order Management -->
    <div class="md:col-span-2">
      <div class="bg-panel p-5 rounded-2xl shadow-sm border border-zinc-200">
        <h2 class="text-sm font-extrabold text-zinc-800 flex items-center gap-2 border-b border-zinc-100 pb-3 mb-4">
          <span class="material-symbols-outlined text-primary">list_alt</span>
          Customer Orders
        </h2>

        <div id="admin-orders-container" class="space-y-4">
          <!-- Orders will be loaded here via JavaScript -->
        </div>
      </div>
    </div>

  </main>

  <script>
    // ==========================================
    // 1. DELIVERY CHARGE MANAGEMENT
    // ==========================================
    function loadDeliverySettings() {
      const settings = JSON.parse(localStorage.getItem('adminSettings')) || {
        prepaidDelivery: 0,
        codDelivery: 60
      };
      
      document.getElementById('prepaid-charge').value = settings.prepaidDelivery;
      document.getElementById('cod-charge').value = settings.codDelivery;
    }

    document.getElementById('delivery-settings-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const updatedSettings = {
        prepaidDelivery: Number(document.getElementById('prepaid-charge').value),
        codDelivery: Number(document.getElementById('cod-charge').value)
      };

      localStorage.setItem('adminSettings', JSON.stringify(updatedSettings));
      alert("✅ Delivery charges updated successfully! Checkout page will now reflect these new rates.");
    });

    // ==========================================
    // 2. ORDER MANAGEMENT & STATUS UPDATE
    // ==========================================
    function loadAdminOrders() {
      const orders = JSON.parse(localStorage.getItem('orderHistory')) || [];
      const container = document.getElementById('admin-orders-container');

      if (orders.length === 0) {
        container.innerHTML = `<p class="text-center text-sm font-bold text-zinc-400 py-10">No orders received yet.</p>`;
        return;
      }

      container.innerHTML = orders.map((order, index) => `
        <div class="border border-zinc-200 rounded-xl p-4 bg-zinc-50 flex flex-col md:flex-row gap-4 justify-between items-start">
          
          <!-- Order Details -->
          <div class="space-y-2 flex-1">
            <div class="flex items-center gap-3">
              <span class="text-xs font-black text-primary">${order.orderId}</span>
              <span class="text-[10px] text-zinc-500 font-bold">${order.date}</span>
            </div>
            
            <div class="space-y-1">
              ${order.items.map(item => `
                <p class="text-xs text-zinc-800 font-semibold">• ${item.name} (Size: ${item.size || '-'}) - Qty: ${item.qty || 1}</p>
              `).join('')}
            </div>

            <p class="text-sm font-extrabold text-zinc-900 pt-1">Total Bill: ₹${order.total}</p>
          </div>

          <!-- Status Updater -->
          <div class="w-full md:w-auto bg-white p-3 rounded-lg border border-zinc-200 shadow-sm">
            <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1">Update Status</label>
            <select onchange="updateOrderStatus(${index}, this.value)" class="w-full md:w-40 p-2 border border-zinc-300 rounded text-xs font-bold focus:outline-primary">
              <option value="Processing" ${order.status === 'Processing' ? 'selected' : ''}>Processing</option>
              <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
              <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
              <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
            </select>
          </div>

        </div>
      `).join('');
    }

    function updateOrderStatus(orderIndex, newStatus) {
      let orders = JSON.parse(localStorage.getItem('orderHistory')) || [];
      if(orders[orderIndex]) {
        orders[orderIndex].status = newStatus;
        localStorage.setItem('orderHistory', JSON.stringify(orders));
        alert(`Order status updated to: ${newStatus}`);
      }
    }

    // Initialize Admin Panel
    window.addEventListener('DOMContentLoaded', () => {
      loadDeliverySettings();
      loadAdminOrders();
    });
  </script>
</body>
</html>
