<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moni Dresses | Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <!-- Admin Topbar -->
    <header class="bg-purple-900 text-white p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2">
            <span class="bg-red-600 px-2 py-1 rounded text-xs font-bold">ADMIN</span>
            <h1 class="text-xl font-bold">Moni Dresses Control Panel</h1>
        </div>
        <button onclick="alert('Logged Out Successfully')" class="text-xs bg-red-600 px-3 py-1.5 rounded font-bold hover:bg-red-700">Logout</button>
    </header>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-6">

        <!-- Sidebar Menu -->
        <div class="bg-white p-4 rounded-xl shadow space-y-2">
            <button onclick="showSection('add-product')" class="w-full text-left p-2.5 rounded font-bold text-sm bg-purple-100 text-purple-900 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Add New Product
            </button>
            <button onclick="showSection('view-orders')" class="w-full text-left p-2.5 rounded font-bold text-sm text-gray-600 hover:bg-gray-100 flex items-center gap-2">
                <i class="fa-solid fa-list-check"></i> Manage Orders
            </button>
            <button onclick="showSection('gateways')" class="w-full text-left p-2.5 rounded font-bold text-sm text-gray-600 hover:bg-gray-100 flex items-center gap-2">
                <i class="fa-solid fa-credit-card"></i> Payment & Shipping Keys
            </button>
        </div>

        <!-- Main Content Area -->
        <div class="md:col-span-3 space-y-6">

            <!-- 1. ADD PRODUCT FORM -->
            <div id="sec-add-product" class="bg-white p-6 rounded-xl shadow space-y-4">
                <h2 class="text-lg font-bold text-purple-900 border-b pb-2"><i class="fa-solid fa-box mr-2"></i>Add New Item to Inventory</h2>
                
                <form class="space-y-4" onsubmit="event.preventDefault(); alert('Product Added to Live Store Successfully!');">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-gray-600">Product Title / Name</label>
                            <input type="text" placeholder="e.g. Cotton Blouse (Red)" class="w-full border p-2 rounded text-sm mt-1" required>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-600">Category</label>
                            <select class="w-full border p-2 rounded text-sm mt-1">
                                <option>Cotton Blouse</option>
                                <option>Petticoat</option>
                                <option>Saree</option>
                                <option>Bundle Pack</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-600">Retail Price (₹)</label>
                            <input type="number" placeholder="299" class="w-full border p-2 rounded text-sm mt-1" required>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-600">Stock Quantity (Units)</label>
                            <input type="number" placeholder="50" class="w-full border p-2 rounded text-sm mt-1" required>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-gray-600">Product Image URL</label>
                        <input type="url" placeholder="https://..." class="w-full border p-2 rounded text-sm mt-1" required>
                    </div>

                    <button type="submit" class="bg-purple-900 text-white font-bold px-6 py-2.5 rounded text-sm hover:bg-purple-800">
                        Publish Product
                    </button>
                </form>
            </div>

            <!-- 2. PAYMENT & SHIPMENT KEYS -->
            <div id="sec-gateways" class="hidden bg-white p-6 rounded-xl shadow space-y-4">
                <h2 class="text-lg font-bold text-purple-900 border-b pb-2"><i class="fa-solid fa-key mr-2"></i>Payment & Shiprocket API Configuration</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-gray-600">Razorpay Key ID</label>
                        <input type="text" placeholder="rzp_live_xxxxxxxxxxxx" class="w-full border p-2 rounded text-sm mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-600">Shiprocket API Token</label>
                        <input type="password" value="************************" class="w-full border p-2 rounded text-sm mt-1">
                    </div>
                    <button onclick="alert('API Keys Saved Successfully!')" class="bg-red-600 text-white font-bold px-6 py-2 rounded text-sm">Save Integration Keys</button>
                </div>
            </div>

            <!-- 3. ORDERS LIST TABLE -->
            <div id="sec-view-orders" class="hidden bg-white p-6 rounded-xl shadow space-y-4">
                <h2 class="text-lg font-bold text-purple-900 border-b pb-2"><i class="fa-solid fa-truck-ramp-box mr-2"></i>Live Customer Orders</h2>
                
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-xs uppercase font-bold text-gray-600">
                            <th class="p-2 border">Order ID</th>
                            <th class="p-2 border">Items</th>
                            <th class="p-2 border">Amount</th>
                            <th class="p-2 border">Fulfillment Hub</th>
                            <th class="p-2 border">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="p-2 border font-bold">#MD-9082</td>
                            <td class="p-2 border">Cotton Blouse Pack (x2)</td>
                            <td class="p-2 border">₹598</td>
                            <td class="p-2 border text-green-700 font-semibold">Chakdaha Franchise</td>
                            <td class="p-2 border"><span class="bg-green-100 text-green-800 text-[10px] px-2 py-0.5 font-bold rounded">Packed</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        function showSection(sec) {
            document.getElementById('sec-add-product').classList.add('hidden');
            document.getElementById('sec-gateways').classList.add('hidden');
            document.getElementById('sec-view-orders').classList.add('hidden');
            
            document.getElementById(`sec-${sec}`).classList.remove('hidden');
        }
    </script>
</body>
</html>
