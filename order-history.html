<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>My Orders — MONI DRESSES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#b3006a", surface: "#fbf9f8" },
          fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen pb-24">

  <!-- HEADER -->
  <header class="fixed top-0 left-0 w-full z-40 flex items-center px-4 py-3 bg-white border-b border-zinc-100 shadow-sm">
    <button onclick="history.back()" class="p-1 text-zinc-700 hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-2xl">arrow_back</span>
    </button>
    <h1 class="text-base font-extrabold text-primary ml-3 uppercase tracking-wider">My Order History</h1>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-[600px] mx-auto pt-20 px-4 space-y-4">
    <div id="history-container" class="space-y-4">
      <p class="text-center text-zinc-400 text-xs py-10">Loading your orders...</p>
    </div>
  </main>

  <!-- SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZdG23Io-oMElZ5XVmhVLd87-sq136dhY",
      authDomain: "moni-dresses-db.firebaseapp.com",
      projectId: "moni-dresses-db",
      storageBucket: "moni-dresses-db.firebasestorage.app",
      messagingSenderId: "24076547918",
      appId: "1:24076547918:web:6cae50157f9c6749ff501f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadCustomerOrders() {
      const container = document.getElementById('history-container');
      
      // Get logged-in user profile from localStorage to match phone number
      const savedUser = JSON.parse(localStorage.getItem('userProfile')) || {};
      const userPhone = savedUser.phone || "";

      if (!userPhone) {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-2xl text-center space-y-3 border border-zinc-200">
            <p class="text-xs text-zinc-500">Please login or provide your phone number to view order history.</p>
            <a href="home.html" class="inline-block px-4 py-2 bg-primary text-white text-xs font-bold rounded-xl">Go to Home</a>
          </div>`;
        return;
      }

      try {
        // Query orders from Firebase where customer phone matches
        const q = query(collection(db, "orders"));
        const querySnapshot = await getDocs(q);
        
        container.innerHTML = "";
        let foundOrders = false;

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          
          // Check if order belongs to current user phone
          if (data.customer?.phone === userPhone) {
            foundOrders = true;

            let formattedDate = "N/A";
            if (data.createdAt && data.createdAt.toDate) {
              formattedDate = data.createdAt.toDate().toLocaleString('en-IN', {
                day: '2-digit', month: 'short', year: 'numeric'
              });
            }

            let itemsHtml = "";
            if (data.items && Array.isArray(data.items)) {
              data.items.forEach(item => {
                itemsHtml += `<div class="flex justify-between text-xs text-zinc-600 py-0.5">
                  <span>${item.name || 'Product'} (x${item.qty || 1})</span>
                  <span class="font-bold">₹${item.price * (item.qty || 1)}</span>
                </div>`;
              });
            }

            let statusColor = "bg-amber-100 text-amber-700";
            if (data.status === "Cancelled") statusColor = "bg-rose-100 text-rose-700";
            if (data.status?.includes("Shipped") || data.status?.includes("Processing")) statusColor = "bg-emerald-100 text-emerald-700";

            // Tracking Section UI
            let trackingSection = "";
            if (data.trackingId) {
              trackingSection = `
                <div class="mt-3 p-3 bg-blue-50 border border-blue-200 rounded-xl space-y-1">
                  <div class="flex justify-between items-center">
                    <span class="text-[11px] font-bold text-blue-800">Shiprocket Tracking ID:</span>
                    <span class="text-xs font-black text-blue-900">${data.trackingId}</span>
                  </div>
                  <p class="text-[10px] text-blue-600">Your parcel has been handed over to the courier partner.</p>
                </div>`;
            } else {
              trackingSection = `
                <div class="mt-3 p-2 bg-zinc-50 rounded-lg text-[10px] text-zinc-400 font-medium text-center">
                  Tracking ID will appear once shipped by admin.
                </div>`;
            }

            const card = document.createElement('div');
            card.className = "bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm space-y-3";
            card.innerHTML = `
              <div class="flex justify-between items-center border-b border-zinc-100 pb-2">
                <div>
                  <span class="text-xs font-black text-primary">${data.orderId}</span>
                  <p class="text-[10px] text-zinc-400 font-semibold">Date: ${formattedDate}</p>
                </div>
                <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase ${statusColor}">${data.status || 'Pending'}</span>
              </div>
              <div class="space-y-1">
                ${itemsHtml}
              </div>
              <div class="border-t border-zinc-100 pt-2 flex justify-between text-xs font-bold">
                <span class="text-zinc-600">Total Paid (${data.financials?.paymentMethod?.toUpperCase()})</span>
                <span class="text-primary font-black">₹${data.financials?.totalAmount}</span>
              </div>
              ${trackingSection}
            `;
            container.appendChild(card);
          }
        });

        if (!foundOrders) {
          container.innerHTML = `<p class="text-center text-zinc-400 text-xs py-10">You haven't placed any orders yet.</p>`;
        }

      } catch (err) {
        console.error("Error fetching history:", err);
        container.innerHTML = `<p class="text-center text-rose-500 text-xs py-10">Failed to load order history.</p>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadCustomerOrders);
  </script>
</body>
</html>
