<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moni Dresses — Admin Login</title><style>body{font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;margin:0;background:#f7f4f2}.card{width:min(420px,90vw);background:#fff;padding:32px;border-radius:18px;box-shadow:0 10px 40px #0001}input,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:10px}button{cursor:pointer;font-weight:700}.error{color:#b42318;min-height:24px}</style></head>
<body><main class="card"><h1>Moni Dresses</h1><p>Admin Panel</p><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><div id="error" class="error"></div><button type="submit">Sign in</button></form></main><script type="module">import { adminLogin } from './admin-auth.js'; document.querySelector('#login').addEventListener('submit',async(e)=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='';try{await adminLogin(document.querySelector('#email').value,document.querySelector('#password').value);location.replace('admin.html')}catch(err){console.error(err);error.textContent=err.message||'Unable to sign in.'}});</script></body></html>
