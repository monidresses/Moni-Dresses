<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Your Cart — MONI DRESSES</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: "#b3006a", surface: "#fbf9f8" }, fontFamily: { sans: ["Plus Jakarta Sans"], brand: ["Bodoni Moda"] } } }
    }
  </script>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen pb-24">

  <!-- Header -->
  <header class="fixed top-0 left-0 w-full z-50 flex items-center px-4 py-3 bg-white border-b border-zinc-100 shadow-sm">
    <button onclick="history.back()" class="p-1 text-zinc-700">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="font-brand text-lg font-bold text-primary ml-4">My Shopping Cart</h1>
  </header>

  <main class="max-w-[600px] mx-auto pt-20 px-4 space-y-6">
    
    <!-- Cart Items Container -->
    <div id="cart-items-container" class="space-y-4">
      <!-- Products will be injected here via JS -->
    </div>

    <!-- Bill Details -->
    <div id="bill-section" class="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm space-y-3 hidden">
      <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-wider border-b border-zinc-100 pb-2">Order Summary</h3>
      <div class="flex justify-between text-xs text-zinc-600">
        <span>Subtotal</span>
        <span id="subtotal-amount" class="font-bold text-zinc-900">₹0</span>
      </div>
      <div class="flex justify-between text-xs text-zinc-600">
        <span>Delivery Charge</span>
        <span class="font-bold text-zinc-900">₹40</span>
      </div>
      <div class="flex justify-between text-sm font-bold border-t border-zinc-100 pt-3">
        <span>Total</span>
        <span id="grand-total" class="text-primary">₹0</span>
      </div>
      
      <button onclick="checkoutOnWhatsApp()" class="w-full py-4 bg-primary text-white font-bold text-xs rounded-xl shadow-lg active:scale-95 transition-all">
        Proceed to Order on WhatsApp
      </button>
    </div>

  </main>

  <script>
    // 1. Load & Render Cart
    function renderCart() {
      const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
      const container = document.getElementById('cart-items-container');
      const billSection = document.getElementById('bill-section');
      
      if (cart.length === 0) {
        container.innerHTML = `
          <div class="text-center pt-20">
            <span class="material-symbols-outlined text-6xl text-zinc-300">shopping_bag</span>
            <p class="text-zinc-500 text-sm mt-4">Your cart is empty!</p>
            <a href="home.html" class="inline-block mt-4 text-primary font-bold text-xs underline">Start Shopping</a>
          </div>`;
        billSection.classList.add('hidden');
        return;
      }

      billSection.classList.remove('hidden');
      
      let subtotal = 0;
      container.innerHTML = cart.map((item, index) => {
        subtotal += item.price;
        return `
          <div class="flex items-center gap-4 bg-white p-3 rounded-xl border border-zinc-200 shadow-sm">
            <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg">
            <div class="flex-1">
              <h3 class="text-xs font-bold text-zinc-800">${item.name}</h3>
              <p class="text-xs text-zinc-500 mt-0.5">Size: ${item.size}</p>
              <p class="text-sm font-bold text-primary mt-1">₹${item.price}</p>
            </div>
            <button onclick="removeItem(${index})" class="text-zinc-400 hover:text-red-500">
              <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
        `;
      }).join('');

      document.getElementById('subtotal-amount').innerText = `₹${subtotal}`;
      document.getElementById('grand-total').innerText = `₹${subtotal + 40}`;
    }

    // 2. Remove Item
    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('cartItems')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cartItems', JSON.stringify(cart));
      renderCart();
      // Optional: Refresh cart badge if app.js is included
      if(typeof updateCartBadge === 'function') updateCartBadge();
    }

    // 3. WhatsApp Checkout
    function checkoutOnWhatsApp() {
      const cart = JSON.parse(localStorage.getItem('cartItems')) || [];
      if (cart.length === 0) return;

      let msg = "Hello, I want to order these items:\n\n";
      cart.forEach((item, i) => {
        msg += `${i+1}. ${item.name} (Size: ${item.size}) - ₹${item.price}\n`;
      });
      msg += `\nTotal: ₹${document.getElementById('grand-total').innerText.replace('₹','')}`;
      
      const whatsappUrl = `https://wa.me/918536891441?text=${encodeURIComponent(msg)}`;
      window.open(whatsappUrl, '_blank');
    }

    window.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
