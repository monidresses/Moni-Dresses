<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Login — MONI DRESSES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
</head>
<body class="bg-[#fbf9f8] min-h-screen flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm p-6 rounded-3xl border border-zinc-200 shadow-lg space-y-6">
    <div class="text-center">
      <h1 class="text-xl font-extrabold text-[#b3006a] uppercase tracking-wider">Moni Dresses</h1>
      <p class="text-xs text-zinc-400 mt-1">Access your customer account securely</p>
    </div>
    <div class="grid grid-cols-2 bg-zinc-100 p-1 rounded-xl">
      <button onclick="window.switchMode('otp')" id="tab-otp" class="py-2.5 text-[11px] font-bold rounded-lg bg-white text-[#b3006a] shadow-sm">Mobile OTP</button>
      <button onclick="window.switchMode('password')" id="tab-password" class="py-2.5 text-[11px] font-bold rounded-lg text-zinc-500">Email Password</button>
    </div>
    <div id="mode-otp" class="space-y-4">
      <div id="phone-container">
        <label class="text-[10px] font-bold text-zinc-500 uppercase">Mobile Number</label>
        <div class="flex items-center border border-zinc-200 rounded-xl bg-zinc-50 mt-1 px-3">
          <span class="text-xs font-bold text-zinc-600">+91</span>
          <input type="tel" id="phone-input" inputmode="numeric" maxlength="10" placeholder="10 Digit Number" class="w-full p-3 text-xs bg-transparent focus:outline-none">
        </div>
      </div>
      <div id="otp-container" class="hidden"><input type="text" id="otp-input" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" class="w-full text-center tracking-[0.5em] text-lg font-bold p-3 border border-zinc-300 rounded-xl bg-zinc-50"></div>
      <button id="otp-btn" onclick="window.handleOTPAction()" class="w-full py-3.5 bg-[#b3006a] text-white font-extrabold text-xs rounded-xl">SEND OTP</button>
    </div>
    <div id="mode-password" class="hidden space-y-4">
      <input type="email" id="email-input" autocomplete="email" placeholder="Email Address" class="w-full p-3 text-xs border border-zinc-200 rounded-xl bg-zinc-50">
      <input type="password" id="pwd-input" autocomplete="current-password" placeholder="Password" class="w-full p-3 text-xs border border-zinc-200 rounded-xl bg-zinc-50">
      <button onclick="window.loginWithPassword()" class="w-full py-3.5 bg-[#b3006a] text-white font-extrabold text-xs rounded-xl">LOGIN</button>
    </div>
    <div class="relative flex items-center py-2"><div class="flex-grow border-t border-zinc-200"></div><span class="px-3 text-[10px] text-zinc-400 font-bold uppercase">Or</span><div class="flex-grow border-t border-zinc-200"></div></div>
    <button onclick="window.loginWithGoogle()" class="w-full py-3 border border-zinc-200 text-zinc-700 font-bold text-xs rounded-xl">Continue with Google</button>
  </div>
  <div id="recaptcha-container"></div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { APP_CONFIG } from './app-config.js';
    const app = initializeApp(APP_CONFIG.firebase);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
    getRedirectResult(auth).then(result => { if (result?.user) window.location.href = 'home.html'; }).catch(console.error);
    window.switchMode = mode => {
      document.getElementById('mode-otp').classList.toggle('hidden', mode !== 'otp');
      document.getElementById('mode-password').classList.toggle('hidden', mode !== 'password');
      document.getElementById('tab-otp').classList.toggle('bg-white', mode === 'otp');
      document.getElementById('tab-password').classList.toggle('bg-white', mode === 'password');
    };
    window.loginWithGoogle = () => signInWithRedirect(auth, provider);
    window.loginWithPassword = async () => {
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('pwd-input').value;
      if (!email || !password) return alert('Enter your email and password.');
      try { await signInWithEmailAndPassword(auth, email, password); window.location.href = 'home.html'; }
      catch (e) { alert(e.code === 'auth/invalid-credential' ? 'Invalid email or password.' : e.message); }
    };
    window.handleOTPAction = async () => {
      const phone = '+91' + document.getElementById('phone-input').value.replace(/\D/g, '');
      const otpContainer = document.getElementById('otp-container');
      const otpInput = document.getElementById('otp-input');
      const btn = document.getElementById('otp-btn');
      if (!window.confirmationResult) {
        if (!/^\+91\d{10}$/.test(phone)) return alert('Enter a valid 10-digit Indian mobile number.');
        try { window.confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier); otpContainer.classList.remove('hidden'); document.getElementById('phone-container').classList.add('hidden'); btn.innerText = 'VERIFY OTP'; }
        catch (e) { alert('Unable to send OTP: ' + e.message); }
      } else {
        try { await window.confirmationResult.confirm(otpInput.value.trim()); window.location.href = 'home.html'; }
        catch { alert('Invalid OTP. Please try again.'); }
      }
    };
  </script>
</body>
</html>
