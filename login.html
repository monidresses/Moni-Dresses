<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Login — MONI DRESSES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-[#fbf9f8] min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-sm p-6 rounded-3xl border border-zinc-200 shadow-lg space-y-6">
    <div class="text-center">
      <h1 class="text-xl font-extrabold text-[#b3006a] uppercase tracking-wider">Moni Dresses</h1>
      <p class="text-xs text-zinc-400 mt-1">Access your account securely</p>
    </div>

    <!-- Tabs -->
    <div class="grid grid-cols-2 bg-zinc-100 p-1 rounded-xl">
      <button onclick="window.switchMode('otp')" id="tab-otp" class="py-2.5 text-[11px] font-bold rounded-lg bg-white text-[#b3006a] shadow-sm">Mobile OTP</button>
      <button onclick="window.switchMode('password')" id="tab-password" class="py-2.5 text-[11px] font-bold rounded-lg text-zinc-500">Password</button>
    </div>

    <!-- OTP Mode -->
    <div id="mode-otp" class="space-y-4">
      <div id="phone-container">
        <label class="text-[10px] font-bold text-zinc-500 uppercase">Mobile Number</label>
        <div class="flex items-center border border-zinc-200 rounded-xl bg-zinc-50 mt-1 px-3">
          <span class="text-xs font-bold text-zinc-600">+91</span>
          <input type="tel" id="phone-input" maxlength="10" placeholder="10 Digit Number" class="w-full p-3 text-xs bg-transparent focus:outline-none">
        </div>
      </div>
      <div id="otp-container" class="hidden">
        <input type="text" id="otp-input" maxlength="6" placeholder="Enter 6-digit OTP" class="w-full text-center tracking-[0.5em] text-lg font-bold p-3 border border-zinc-300 rounded-xl bg-zinc-50">
      </div>
      <button id="otp-btn" onclick="window.handleOTPAction()" class="w-full py-3.5 bg-[#b3006a] text-white font-extrabold text-xs rounded-xl active:scale-95 transition-all">SEND OTP</button>
    </div>

    <!-- Password Mode -->
    <div id="mode-password" class="hidden space-y-4">
      <input type="tel" id="pwd-phone" maxlength="10" placeholder="Mobile Number" class="w-full p-3 text-xs border border-zinc-200 rounded-xl bg-zinc-50">
      <input type="password" id="pwd-input" placeholder="Enter Password" class="w-full p-3 text-xs border border-zinc-200 rounded-xl bg-zinc-50">
      <button onclick="window.loginWithPassword()" class="w-full py-3.5 bg-[#b3006a] text-white font-extrabold text-xs rounded-xl active:scale-95 transition-all">LOGIN</button>
    </div>

    <div class="relative flex items-center py-2">
      <div class="flex-grow border-t border-zinc-200"></div>
      <span class="px-3 text-[10px] text-zinc-400 font-bold uppercase">Or</span>
      <div class="flex-grow border-t border-zinc-200"></div>
    </div>

    <button onclick="window.loginWithGoogle()" class="w-full py-3 border border-zinc-200 text-zinc-700 font-bold text-xs rounded-xl flex items-center justify-center gap-2 hover:bg-zinc-50 transition-all">
      Continue with Google
    </button>
  </div>

  <div id="recaptcha-container"></div>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZdG23Io-oMElZ5XVmhVLd87-sq136dhY",
      authDomain: "moni-dresses-db.firebaseapp.com",
      projectId: "moni-dresses-db",
      storageBucket: "moni-dresses-db.firebasestorage.app",
      messagingSenderId: "24076547918",
      appId: "1:24076547918:web:6cae50157f9c6749ff501f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Fix: Re-initialize on load
    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });

    window.switchMode = (mode) => {
      document.getElementById('mode-otp').classList.toggle('hidden', mode !== 'otp');
      document.getElementById('mode-password').classList.toggle('hidden', mode !== 'password');
    };

    window.loginWithGoogle = () => signInWithRedirect(auth, provider);

    window.handleOTPAction = async () => {
      const phoneInput = document.getElementById('phone-input');
      const otpContainer = document.getElementById('otp-container');
      const otpInput = document.getElementById('otp-input');
      const btn = document.getElementById('otp-btn');

      if (!window.confirmationResult) {
        // Send OTP
        const phone = "+91" + phoneInput.value;
        try {
          window.confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
          otpContainer.classList.remove('hidden');
          document.getElementById('phone-container').classList.add('hidden');
          btn.innerText = "VERIFY OTP";
        } catch (e) { alert("Error: " + e.message); }
      } else {
        // Verify OTP
        try {
          await window.confirmationResult.confirm(otpInput.value);
          window.location.href = "home.html";
        } catch (e) { alert("Invalid OTP!"); }
      }
    };
  </script>
</body>
</html>
