<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Login — MONI DRESSES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#b3006a", surface: "#fbf9f8" },
          fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-sm p-6 rounded-2xl border border-zinc-200 shadow-sm space-y-5">
    <div class="text-center space-y-1">
      <h1 class="text-base font-extrabold text-primary uppercase tracking-wider">Moni Dresses</h1>
      <p class="text-xs text-zinc-400">Login with your mobile number</p>
    </div>

    <!-- Phone Number Input Section -->
    <div id="phone-section" class="space-y-3">
      <div>
        <label class="text-[10px] font-bold text-zinc-500 uppercase">Mobile Number *</label>
        <div class="flex items-center border border-zinc-200 rounded-xl bg-zinc-50/50 mt-1">
          <span class="pl-3 text-xs font-bold text-zinc-600">+91</span>
          <input type="tel" id="phone-input" maxlength="10" placeholder="10 Digit Number" class="w-full p-2.5 text-xs bg-transparent focus:outline-none">
        </div>
      </div>
      <button onclick="sendOTP()" class="w-full py-3.5 bg-primary text-white font-extrabold text-xs rounded-xl shadow-md active:scale-95 transition-all uppercase tracking-wider">
        Send OTP
      </button>
    </div>

    <!-- OTP Input Section (Hidden Initially) -->
    <div id="otp-section" class="space-y-3 hidden">
      <div>
        <label class="text-[10px] font-bold text-zinc-500 uppercase">Enter 6-Digit OTP *</label>
        <input type="text" id="otp-input" maxlength="6" placeholder="123456" class="w-full text-center tracking-[0.5em] text-lg font-bold p-3 border border-zinc-300 rounded-xl focus:outline-primary bg-zinc-50 mt-1">
      </div>
      <button onclick="verifyOTP()" class="w-full py-3.5 bg-primary text-white font-extrabold text-xs rounded-xl shadow-md active:scale-95 transition-all uppercase tracking-wider">
        Verify & Login
      </button>
    </div>

    <!-- Hidden reCAPTCHA Container -->
    <div id="recaptcha-container"></div>
  </div>

  <!-- FIREBASE AUTH SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZdG23Io-oMElZ5XVmhVLd87-sq136dhY",
      authDomain: "moni-dresses-db.firebaseapp.com",
      projectId: "moni-dresses-db",
      storageBucket: "moni-dresses-db.firebasestorage.app",
      messagingSenderId: "24076547918",
      appId: "1:24076547918:web:6cae50157f9c6749ff501f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Initialize invisible reCAPTCHA
    window.addEventListener('DOMContentLoaded', () => {
      window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
        'size': 'invisible',
        'callback': (response) => {}
      });
    });

    // Send OTP Function
    window.sendOTP = function() {
      const phoneNumberVal = document.getElementById('phone-input').value.trim();
      if (phoneNumberVal.length !== 10) {
        alert("Please enter a valid 10-digit mobile number!");
        return;
      }

      const phoneNumber = "+91" + phoneNumberVal;
      const appVerifier = window.recaptchaVerifier;

      signInWithPhoneNumber(auth, phoneNumber, appVerifier)
        .then((confirmationResult) => {
          window.confirmationResult = confirmationResult;
          alert("OTP sent successfully to " + phoneNumber);
          document.getElementById('phone-section').classList.add('hidden');
          document.getElementById('otp-section').classList.remove('hidden');
        })
        .catch((error) => {
          console.error("Error during sending OTP:", error);
          alert("Failed to send OTP: " + error.message);
        });
    };

    // Verify OTP Function
    window.verifyOTP = function() {
      const otpCode = document.getElementById('otp-input').value.trim();
      if (otpCode.length < 6) {
        alert("Please enter the complete 6-digit OTP!");
        return;
      }

      window.confirmationResult.confirm(otpCode)
        .then((result) => {
          const user = result.user;
          alert("Login Successful!");

          const userProfile = {
            phone: user.phoneNumber.replace("+91", ""),
            uid: user.uid,
            name: "Customer"
          };
          localStorage.setItem('userProfile', JSON.stringify(userProfile));

          window.location.href = 'home.html';
        })
        .catch((error) => {
          console.error("Invalid OTP:", error);
          alert("Invalid OTP! Please check and try again.");
        });
    };
  </script>
</body>
</html>
