<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Login / Register — MONI DRESSES</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#b3006a",
            surface: "#fbf9f8"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
            brand: ["Bodoni Moda", "serif"]
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen flex flex-col justify-between p-4">

  <!-- Top Header Navigation -->
  <header class="w-full max-w-[600px] mx-auto flex items-center justify-between py-2">
    <button onclick="history.back()" aria-label="Back" class="p-1 text-zinc-700 active:scale-95">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <a href="home.html" class="font-brand text-lg font-bold text-primary tracking-wider">MONI DRESSES</a>
    <span class="w-6"></span>
  </header>

  <!-- Login Main Container -->
  <main class="w-full max-w-[400px] mx-auto my-auto py-6">
    
    <!-- Brand Banner Info -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-primary/10 text-primary rounded-2xl flex items-center justify-center mx-auto mb-3">
        <span class="material-symbols-outlined text-3xl">lock</span>
      </div>
      <h1 class="text-xl font-extrabold text-zinc-900">Welcome to MONI DRESSES</h1>
      <p class="text-xs text-zinc-500 mt-1">Login or signup to manage orders and checkout fast</p>
    </div>

    <!-- Step 1: Mobile Phone Number Input Form -->
    <form id="phone-form" onsubmit="sendOTP(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-zinc-700 mb-1.5">Mobile Phone Number</label>
        <div class="flex border border-zinc-300 rounded-xl overflow-hidden focus-within:border-primary bg-white">
          <span class="bg-zinc-100 text-zinc-600 text-xs font-bold px-3 py-3 flex items-center border-r border-zinc-200">+91</span>
          <input type="tel" id="user-phone" required maxlength="10" placeholder="Enter 10-digit number" class="w-full text-xs px-3 py-3 focus:outline-none font-medium text-zinc-800" />
        </div>
      </div>

      <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-primary font-bold text-xs text-white shadow-md hover:bg-primary/90 active:scale-95 transition-all flex items-center justify-center gap-1">
        Get OTP <span class="material-symbols-outlined text-sm">arrow_forward</span>
      </button>
    </form>

    <!-- Step 2: OTP Verification Form (Hidden Initially) -->
    <form id="otp-form" onsubmit="verifyOTP(event)" class="space-y-4 hidden">
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-xs font-bold text-zinc-700">Enter 4-Digit OTP</label>
          <button type="button" onclick="resendOTP()" class="text-[11px] font-bold text-primary">Resend</button>
        </div>
        <input type="text" id="user-otp" required maxlength="4" placeholder="••••" class="w-full text-center text-lg tracking-widest font-bold py-2.5 border border-zinc-300 rounded-xl focus:outline-none focus:border-primary bg-white" />
        <p class="text-[10px] text-zinc-400 mt-1">Sent to +91 <span id="display-phone" class="font-bold text-zinc-600"></span></p>
      </div>

      <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-primary font-bold text-xs text-white shadow-md hover:bg-primary/90 active:scale-95 transition-all">
        Verify & Continue
      </button>
    </form>

    <!-- Divider -->
    <div class="relative my-6 flex items-center justify-center">
      <div class="w-full border-t border-zinc-200"></div>
      <span class="absolute bg-surface px-3 text-[10px] text-zinc-400 font-bold uppercase tracking-wider">OR</span>
    </div>

    <!-- Google One-Tap Login Button -->
    <button onclick="googleLogin()" class="w-full py-3 px-4 border border-zinc-300 rounded-xl bg-white font-bold text-xs text-zinc-700 hover:bg-zinc-50 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-sm">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

  </main>

  <!-- Footer Terms Text -->
  <footer class="text-center text-[10px] text-zinc-400 max-w-[400px] mx-auto pb-2">
    By continuing, you agree to MONI DRESSES <a href="policies.html#terms" class="underline font-bold text-zinc-600">Terms of Use</a> & <a href="policies.html#privacy" class="underline font-bold text-zinc-600">Privacy Policy</a>.
  </footer>

  <script>
    function sendOTP(e) {
      e.preventDefault();
      const phone = document.getElementById('user-phone').value;
      if (phone.length === 10) {
        document.getElementById('display-phone').innerText = phone;
        document.getElementById('phone-form').classList.add('hidden');
        document.getElementById('otp-form').classList.remove('hidden');
      } else {
        alert('Please enter a valid 10-digit mobile number.');
      }
    }

    function verifyOTP(e) {
      e.preventDefault();
      const otp = document.getElementById('user-otp').value;
      if (otp.length === 4) {
        completeLogin();
      } else {
        alert('Please enter a valid 4-digit OTP.');
      }
    }

    function resendOTP() {
      alert('A new OTP has been sent to your mobile number.');
    }

    function googleLogin() {
      completeLogin();
    }

    function completeLogin() {
      // Save Login Status
      localStorage.setItem("isLoggedIn", "true");

      // Redirect back to Checkout if redirected from Cart, else go to Home
      const redirectPage = localStorage.getItem("redirectAfterLogin") || "home.html";
      localStorage.removeItem("redirectAfterLogin");
      
      alert("Login Successful!");
      window.location.href = redirectPage;
    }
  </script>

  <script src="app.js" defer></script>
</body>
</html>
